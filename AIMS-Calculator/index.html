<title>AIMS Tier 1 Floor Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Petrona:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E2849;--card:#F4F3F1;--fg:#1A1815;--muted:#65635F;--line:#D8D6D2;--accent:#1F4D85;--err:#A23E3E;--rule:#A4BC52}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Figtree',system-ui,sans-serif;display:grid;place-items:center;padding:16px}
.lock{display:flex;align-items:center;gap:14px;color:#F4F3F1;margin-bottom:22px;justify-content:center}
.mark{font-family:'Petrona',Georgia,serif;font-style:italic;font-weight:300;font-size:2.4rem;line-height:1}
.rule{width:1px;align-self:stretch;background:var(--rule)}
.words{font-size:.6875rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;line-height:1.7}
form{background:var(--card);border-radius:4px;padding:24px;width:min(360px,100%);box-shadow:0 4px 12px rgba(8,24,44,.3)}
h1{font-family:'Petrona',Georgia,serif;font-weight:400;font-size:1.4rem;margin:0 0 4px}
p{margin:0 0 16px;color:var(--muted);font-size:.875rem}
label{display:block;font-size:.8125rem;font-weight:600;margin-bottom:6px}
input{width:100%;height:40px;border:1px solid var(--line);border-radius:2px;padding:0 10px;font:inherit;background:#fff;color:var(--fg)}
input:focus{outline:2px solid #3168A0;outline-offset:1px}
button{margin-top:12px;width:100%;height:40px;border:0;border-radius:2px;background:var(--accent);color:#fff;font:600 .9rem 'Figtree',system-ui,sans-serif;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--err);font-size:.8125rem;margin:10px 0 0;min-height:1.2em}
</style></head><body>
<div>
<div class="lock"><span class="mark">AIMS</span><span class="rule"></span><span class="words">Advancing Independent<br>Missions for Schools</span></div>
<form id="f" autocomplete="off">
<h1>Tier 1 floor calculator</h1>
<p>Enter the password to open the calculator.</p>
<label for="pw">Password</label>
<input id="pw" type="password" autofocus required>
<button id="go" type="submit">Open</button>
<div class="err" id="err" role="alert"></div>
</form></div>

async function open(pw,quiet){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
