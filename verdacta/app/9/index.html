<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Verdacta · Magnolia Environmental Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;0,300;0,400;0,500;0,600;1,300;1,400&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══ @verdacta/ui tokens ═══ */
:root{
--pine-100:#E6EEE9;--pine-200:#C5D8CD;--pine-300:#9BBBA8;--pine-400:#6E9A82;--pine-500:#4A7D64;
--pine-600:#2F5F4A;--pine-700:#24493A;--pine-800:#1B382D;--pine-900:#12261F;
--verdigris-100:#E3F0ED;--verdigris-200:#C0DED8;--verdigris-300:#92C4BB;--verdigris-400:#64A89B;
--verdigris-500:#418D80;--verdigris-600:#327264;--verdigris-700:#285A50;--verdigris-800:#1F463E;--verdigris-900:#15302B;
--copper-200:#E9CDB7;--copper-300:#D7AB88;--copper-400:#C1885C;--copper-500:#A9683C;--copper-600:#8A5430;--copper-700:#6D4226;
--bone:#FBFBF7;--limestone:#F2F3EC;--ash:#E4E7DB;--sagegray:#D3D7C8;--lichen:#A9AFA0;
--fieldgray:#737B6E;--slategreen:#4E564E;--ink:#161F1A;--white:#FFF;
--st-compliant:#3A7D34;--st-compliant-bg:#E3EFDA;--st-compliant-tx:#2C5E27;
--st-due:#B87A1C;--st-due-bg:#F7ECD2;--st-due-tx:#7A5210;
--st-overdue:#B03A26;--st-overdue-bg:#F9E5DF;--st-overdue-tx:#8C2F1E;
--st-review:#3D74B8;--st-review-bg:#E1EBF6;--st-review-tx:#2C567F;
--st-superseded:#6E7468;--st-superseded-bg:#E9EBE2;--st-superseded-tx:#565C52;
--chart-1:#1D7043;--chart-2:#C07A33;--chart-3:#3D74B8;--chart-4:#9E4E86;
--font-display:'Spectral','Georgia',serif;--font-body:'Public Sans',system-ui,sans-serif;--font-mono:'Spline Sans Mono','Menlo',monospace;
--fs-micro:.6875rem;--fs-caption:.8125rem;--fs-sm:.875rem;--fs-base:1rem;--fs-lg:1.125rem;--fs-xl:1.375rem;--fs-2xl:1.75rem;--fs-3xl:2.25rem;--fs-4xl:2.75rem;
--s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-8:32px;--s-10:40px;--s-12:48px;--s-16:64px;
--r-sm:5px;--r-md:9px;--r-lg:14px;--r-xl:18px;
--shadow-sm:0 1px 2px rgba(18,38,31,.06);--shadow-md:0 4px 12px rgba(18,38,31,.08),0 1px 3px rgba(18,38,31,.05);
--ease:cubic-bezier(.22,1,.36,1);--dur:160ms;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-body);font-size:var(--fs-sm);line-height:1.62;color:var(--ink);background:var(--limestone);-webkit-font-smoothing:antialiased}
a{color:var(--verdigris-700);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:300;color:var(--pine-800);margin:0;line-height:1.15}
button{font-family:var(--font-body)}
::selection{background:var(--verdigris-200);color:var(--pine-900)}

/* ═══ Shell ═══ */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{background:var(--pine-800);color:var(--sagegray);padding:var(--s-5) 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.rail::-webkit-scrollbar{width:0}
.wm{font-family:var(--font-display);line-height:1;white-space:nowrap}
.wm .verd{color:var(--bone);font-weight:500}
.wm .acta{color:var(--verdigris-300);font-style:italic;font-weight:300}
.rail-logo{padding:0 var(--s-5) var(--s-4);font-size:var(--fs-xl);border-bottom:1px solid rgba(251,251,247,.1);margin-bottom:var(--s-4)}
.rail-firm{padding:0 var(--s-5);font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.13em;color:var(--pine-300);margin:var(--s-2) 0 var(--s-2)}
.rail a.nav{display:flex;align-items:center;gap:10px;padding:10px var(--s-5);color:var(--sagegray);font-size:var(--fs-sm);border-left:3px solid transparent;transition:all var(--dur) var(--ease)}
.rail a.nav:hover{background:rgba(251,251,247,.06);text-decoration:none;color:var(--bone)}
.rail a.nav.active{background:rgba(65,141,128,.24);color:var(--bone);border-left-color:var(--verdigris-400);font-weight:600}
.rail a.nav .ic{width:16px;height:16px;flex:none;opacity:.75}
.rail a.nav .badge{margin-left:auto;background:var(--st-overdue);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 7px}
.rail a.nav .badge.amber{background:var(--st-due)}
.rail-bottom{margin-top:auto;padding:var(--s-4) var(--s-5) 0;border-top:1px solid rgba(251,251,247,.1)}
.rail-user{display:flex;gap:10px;align-items:center;font-size:var(--fs-caption);color:var(--pine-200)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--verdigris-600);color:var(--bone);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.avatar.sm{width:24px;height:24px;font-size:9px}
.avatar.copper{background:var(--copper-500)}.avatar.plum{background:#9E4E86}.avatar.river{background:#3D74B8}.avatar.pine{background:var(--pine-500)}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--bone);border-bottom:1px solid var(--sagegray);padding:var(--s-3) var(--s-8);display:flex;align-items:center;gap:var(--s-5);position:sticky;top:0;z-index:40}
.crumb{font-size:var(--fs-caption);color:var(--fieldgray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--pine-800);font-weight:600}
.search{margin-left:auto;position:relative}
.search input{width:290px;font-family:var(--font-body);font-size:var(--fs-caption);padding:8px 12px 8px 30px;border:1.5px solid #E0E3D6;border-radius:99px;background:var(--white);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--verdigris-600);box-shadow:0 0 0 3px rgba(65,141,128,.22)}
.search .mag{position:absolute;left:9px;top:7px;color:var(--lichen)}
.search-results{position:absolute;top:36px;right:0;width:360px;background:var(--bone);border:1px solid var(--sagegray);border-radius:var(--r-lg);box-shadow:var(--shadow-md);z-index:60;max-height:340px;overflow-y:auto;display:none}
.search-results a{display:block;padding:9px 14px;border-bottom:1px solid var(--ash);font-size:var(--fs-caption);color:var(--ink)}
.search-results a:hover{background:var(--limestone);text-decoration:none}
.search-results .k{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.08em;color:var(--fieldgray)}
.today-chip{font-size:var(--fs-micro);font-weight:600;color:var(--fieldgray);background:var(--ash);padding:4px 10px;border-radius:var(--r-md);white-space:nowrap}
.view{padding:var(--s-12) var(--s-10);max-width:1380px;width:100%;margin:0 auto}

/* ═══ Primitives ═══ */
.card{background:var(--bone);border:1px solid #E0E3D6;border-radius:var(--r-lg);box-shadow:0 1px 2px rgba(18,38,31,.03),0 6px 20px rgba(18,38,31,.05)}
.card-pad{padding:var(--s-6)}
.section-label{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.14em;color:var(--verdigris-700);font-weight:700;margin-bottom:var(--s-4);display:flex;align-items:center;gap:8px}
.section-label::after{content:"";flex:1;height:1px;background:var(--ash)}
.grid{display:grid;gap:var(--s-4)}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--s-4);margin-bottom:var(--s-8)}
.kpi{background:var(--bone);border:1px solid #E0E3D6;border-radius:var(--r-lg);padding:var(--s-5)}
.kpi .lbl{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.12em;color:var(--fieldgray);margin-bottom:2px;white-space:nowrap}
.kpi .num{font-family:var(--font-display);font-size:var(--fs-3xl);font-weight:300;color:var(--pine-700);line-height:1.05}
.kpi .num.red{color:var(--st-overdue)}.kpi .num.amber{color:var(--st-due-tx)}
.kpi .sub{font-size:var(--fs-micro);color:var(--fieldgray)}
.kpi.alert{border-color:var(--st-overdue);background:var(--st-overdue-bg)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-micro);font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.chip .ic{width:6px;height:6px;border-radius:50%;flex:none}
.chip.compliant{background:var(--st-compliant-bg);color:var(--st-compliant-tx)}.chip.compliant .ic{background:var(--st-compliant)}
.chip.due{background:var(--st-due-bg);color:var(--st-due-tx)}.chip.due .ic{background:var(--st-due);border-radius:1px}
.chip.overdue{background:var(--st-overdue-bg);color:var(--st-overdue-tx)}.chip.overdue .ic{background:var(--st-overdue);border-radius:1px;transform:rotate(45deg)}
.chip.review{background:var(--st-review-bg);color:var(--st-review-tx)}.chip.review .ic{background:var(--st-review)}
.chip.superseded{background:var(--st-superseded-bg);color:var(--st-superseded-tx)}.chip.superseded .ic{background:var(--st-superseded)}
.ptag{display:inline-flex;font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.1em;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.ptag.air{background:var(--pine-100);color:var(--pine-700)}
.ptag.water{background:var(--st-review-bg);color:var(--st-review-tx)}
.ptag.stormwater{background:var(--verdigris-100);color:var(--verdigris-800)}
.ptag.pretreatment{background:#F3E7EF;color:#7A3D68}
.cite{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;font-weight:500;color:var(--verdigris-800);background:var(--verdigris-100);border:1px solid var(--verdigris-200);border-radius:var(--r-sm);padding:1px 7px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cite.wrap{white-space:normal;max-width:100%;line-height:1.5}
.cite::before{content:"§";color:var(--copper-600);font-family:var(--font-display)}
.mono{font-family:var(--font-body);font-weight:600;font-variant-numeric:tabular-nums;font-size:var(--fs-caption);letter-spacing:.01em}
.btn{font-size:var(--fs-caption);font-weight:600;padding:9px 18px;border-radius:99px;border:1.5px solid transparent;cursor:pointer;transition:all var(--dur) var(--ease)}
.btn-primary{background:var(--pine-600);color:var(--bone)}.btn-primary:hover{background:var(--pine-800)}
.btn-ghost{background:transparent;border-color:var(--pine-400);color:var(--pine-700)}.btn-ghost:hover{background:var(--ash)}
.btn:focus-visible{outline:3px solid var(--verdigris-400);outline-offset:2px}
table.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-caption)}
.tbl th{text-align:left;padding:12px 16px;font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.09em;color:var(--slategreen);background:var(--ash);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:15px 16px;border-top:1px solid var(--ash);vertical-align:middle}
.tbl tr.row-link{cursor:pointer}
.tbl tr.row-link:hover{background:var(--limestone)}
.tbl tr.ovd{background:var(--st-overdue-bg)}
.duecell{font-family:var(--font-body);font-weight:600;font-variant-numeric:tabular-nums;font-size:var(--fs-caption);white-space:nowrap}
.duecell .rel{display:block;font-family:var(--font-body);font-weight:600;font-size:var(--fs-micro);color:var(--fieldgray)}
.duecell .rel.red{color:var(--st-overdue)}.duecell .rel.amber{color:var(--st-due-tx)}
.empty{border:1px dashed var(--sagegray);border-radius:var(--r-lg);padding:var(--s-8);text-align:center;color:var(--fieldgray);font-size:var(--fs-caption)}
.empty .glyph{font-family:var(--font-display);font-size:var(--fs-2xl);color:var(--lichen)}
.progress{height:7px;background:var(--ash);border-radius:99px;overflow:hidden}
.progress > div{height:100%;background:linear-gradient(90deg,var(--verdigris-500),var(--verdigris-600));border-radius:99px}
.runway{height:10px;background:var(--ash);border-radius:99px;overflow:hidden;position:relative}
.runway > div{height:100%;border-radius:99px}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--ash);margin:var(--s-5) 0 var(--s-5)}
.tabs button{background:none;border:none;padding:9px 16px;font-size:var(--fs-sm);font-weight:600;color:var(--fieldgray);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs button.active{color:var(--pine-800);border-bottom-color:var(--verdigris-500)}
.tabs button:hover{color:var(--pine-700)}
.tabs button .ct{font-size:10px;background:var(--ash);border-radius:99px;padding:1px 6px;margin-left:5px;color:var(--slategreen)}

/* timeline */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--ash)}
.timeline li{position:relative;padding:0 0 var(--s-5) var(--s-8)}
.timeline .dot{position:absolute;left:4px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--bone);border:2px solid var(--verdigris-500);display:flex;align-items:center;justify-content:center}
.timeline li.k-rejection .dot,.timeline li.k-agency-action.neg .dot{border-color:var(--st-overdue)}
.timeline li.k-submission .dot{border-color:var(--pine-500);background:var(--pine-500)}
.timeline li.k-agency-action .dot{border-color:var(--st-review)}
.timeline li.k-reminder .dot{border-color:var(--st-due)}
.timeline .t-date{font-size:var(--fs-micro);font-weight:600;font-variant-numeric:tabular-nums;color:var(--fieldgray)}
.timeline .t-text{font-size:var(--fs-caption);color:var(--ink);margin:1px 0 2px}
.timeline .t-by{font-size:var(--fs-micro);color:var(--fieldgray)}
.kind-tag{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 7px;border-radius:99px;margin-right:6px;background:var(--ash);color:var(--slategreen);max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.kind-tag.submission{background:var(--pine-100);color:var(--pine-700)}
.kind-tag.rejection{background:var(--st-overdue-bg);color:var(--st-overdue-tx)}
.kind-tag.agency-action{background:var(--st-review-bg);color:var(--st-review-tx)}
.kind-tag.reminder{background:var(--st-due-bg);color:var(--st-due-tx)}
.kind-tag.call{background:#F3E7EF;color:#7A3D68}

/* documents */
.doc-row{display:flex;align-items:center;gap:var(--s-4);padding:15px 18px;border-top:1px solid var(--ash)}
.doc-row:first-child{border-top:0}
.doc-row:hover{background:var(--limestone)}
.doc-ic{width:34px;height:40px;border:1.5px solid var(--sagegray);border-radius:3px;background:var(--white);position:relative;flex:none;display:flex;align-items:flex-end;justify-content:center;font-size:8px;font-weight:700;color:var(--fieldgray);padding-bottom:3px}
.doc-ic::before{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 10px 10px 0;border-color:var(--limestone) var(--limestone) var(--sagegray) var(--sagegray)}
.doc-name{font-weight:600;font-size:var(--fs-caption);color:var(--ink)}
.doc-meta{font-size:var(--fs-micro);color:var(--fieldgray)}
.doc-status{margin-left:auto;flex:none}
.dstat{display:inline-flex;font-size:var(--fs-micro);font-weight:700;padding:2px 9px;border-radius:var(--r-sm);white-space:nowrap}
.dstat.accepted{background:var(--st-compliant-bg);color:var(--st-compliant-tx)}
.dstat.submitted,.dstat.resubmitted{background:var(--st-review-bg);color:var(--st-review-tx)}
.dstat.rejected,.dstat.revision-requested{background:var(--st-overdue-bg);color:var(--st-overdue-tx)}
.dstat.draft{background:var(--ash);color:var(--slategreen)}
.dstat.received{background:var(--verdigris-100);color:var(--verdigris-800)}

/* calendar */
.cal-head{display:flex;align-items:center;gap:var(--s-4);margin-bottom:var(--s-4)}
.cal-title{font-family:var(--font-display);font-size:var(--fs-2xl);font-weight:300}
.cal-nav{display:flex;gap:6px;margin-left:auto}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal-dow{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.1em;color:var(--fieldgray);text-align:center;padding:4px 0;font-weight:700}
.cal-cell{min-width:0;background:var(--bone);border:1px solid #E0E3D6;border-radius:var(--r-md);min-height:104px;padding:9px;font-size:var(--fs-micro)}
.cal-cell.dim{background:var(--limestone);opacity:.55}
.cal-cell.today{border:1.5px solid var(--verdigris-500);box-shadow:0 0 0 3px rgba(65,141,128,.15)}
.cal-date{font-weight:600;font-variant-numeric:tabular-nums;color:var(--fieldgray);margin-bottom:5px}
.cal-cell.today .cal-date{color:var(--verdigris-700);font-weight:700}
.pill{display:block;border-radius:var(--r-sm);font-size:10px;font-weight:600;padding:2px 6px;margin-bottom:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid}
.pill.due{background:var(--st-due-bg);color:var(--st-due-tx);border-color:var(--st-due)}
.pill.overdue{background:var(--st-overdue-bg);color:var(--st-overdue-tx);border-color:var(--st-overdue)}
.pill.compliant{background:var(--verdigris-100);color:var(--verdigris-800);border-color:var(--verdigris-500)}
.pill.review{background:var(--st-review-bg);color:var(--st-review-tx);border-color:var(--st-review)}
.pill.project{background:var(--pine-100);color:var(--pine-700);border-color:var(--pine-500)}

/* notifications */
.notif-row{display:flex;gap:var(--s-4);padding:15px 18px;border-top:1px solid var(--ash);align-items:flex-start}
.notif-row:first-child{border-top:0}
.lvl{flex:none;font-family:var(--font-mono);font-size:var(--fs-micro);font-weight:700;padding:3px 8px;border-radius:var(--r-sm);margin-top:1px}
.lvl.warn{background:var(--st-due-bg);color:var(--st-due-tx)}
.lvl.crit{background:var(--st-overdue-bg);color:var(--st-overdue-tx)}
.lvl.info{background:var(--st-review-bg);color:var(--st-review-tx)}
.chan{display:inline-flex;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--sagegray);border-radius:99px;padding:1px 7px;color:var(--slategreen);margin-left:4px}
.ladder{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rung{font-family:var(--font-mono);font-size:var(--fs-micro);font-weight:600;background:var(--verdigris-100);color:var(--verdigris-800);border:1px solid var(--verdigris-200);border-radius:99px;padding:2px 9px}
.rung.sms{background:var(--st-due-bg);color:var(--st-due-tx);border-color:var(--st-due)}
.toggle{display:inline-block;width:32px;height:18px;background:var(--verdigris-500);border-radius:99px;position:relative;vertical-align:middle}
.toggle::after{content:"";position:absolute;right:2px;top:2px;width:14px;height:14px;background:#fff;border-radius:50%}
.toggle.off{background:var(--sagegray)}
.toggle.off::after{right:auto;left:2px}

/* misc */
.two-col{display:grid;grid-template-columns:2fr 1fr;gap:var(--s-6);align-items:start}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-4)}
.hero-strip{background:var(--pine-800);border-radius:var(--r-xl);color:var(--sagegray);padding:var(--s-6) var(--s-8);display:flex;align-items:center;gap:var(--s-8);margin-bottom:var(--s-8);flex-wrap:wrap}
.hero-strip h2{color:var(--bone);font-size:var(--fs-2xl)}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:var(--s-4);align-items:center}
.filterbar select,.filterbar input{font-family:var(--font-body);font-size:var(--fs-caption);padding:7px 10px;border:1.5px solid var(--sagegray);border-radius:var(--r-md);background:var(--white);color:var(--ink)}
.filterbar select:focus,.filterbar input:focus{outline:none;border-color:var(--verdigris-600)}
.bar-row{display:grid;grid-template-columns:110px 1fr 30px;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .blbl{font-size:var(--fs-caption);color:var(--slategreen)}
.bar-row .btrack{height:13px;background:var(--ash);border-radius:0 4px 4px 0}
.bar-row .bfill{height:100%;background:var(--chart-1);border-radius:0 4px 4px 0}
.bar-row .bval{font-family:var(--font-mono);font-size:var(--fs-caption);text-align:right;color:var(--ink)}
.breadcrumbs{font-size:var(--fs-caption);color:var(--fieldgray);margin-bottom:var(--s-4)}
.breadcrumbs a{color:var(--verdigris-700)}
.pagehead{display:flex;align-items:flex-start;gap:var(--s-5);margin-bottom:var(--s-8);flex-wrap:wrap}
.pagehead h1{font-size:var(--fs-3xl)}
.pagehead .sub{color:var(--fieldgray);font-size:var(--fs-sm);margin-top:4px}
.meta-grid{display:grid;grid-template-columns:repeat(5,auto);gap:var(--s-6);margin-top:var(--s-4)}
.meta-grid .m .k{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.12em;color:var(--fieldgray)}
.meta-grid .m .v{font-weight:600;font-variant-numeric:tabular-nums;font-size:var(--fs-sm);color:var(--ink);margin-top:3px}
/* ═══ Responsive ═══ */
.two-col>*,.three-col>*,.grid>*,.kpis>*{min-width:0}
.navtoggle{display:none;background:var(--white);border:1.5px solid #E0E3D6;border-radius:var(--r-md);width:36px;height:32px;flex:none;color:var(--pine-700);font-size:16px;cursor:pointer;line-height:1;align-items:center;justify-content:center}
.rail-scrim{position:fixed;inset:0;background:rgba(22,31,26,.5);z-index:95;opacity:0;pointer-events:none;transition:opacity .25s var(--ease)}
.rail-scrim.show{opacity:1;pointer-events:auto}
.cal-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media(min-width:1800px){.view{max-width:1760px}.shell{grid-template-columns:262px 1fr}.kpis{grid-template-columns:repeat(6,1fr)}}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.two-col,.three-col,.two-col[style]{grid-template-columns:1fr !important}.meta-grid{grid-template-columns:repeat(2,1fr)}.view{padding:var(--s-8) var(--s-6)}}
@media(max-width:840px){
  .view{overflow-x:clip}
  .kpis,.kpis[style]{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  .kpi .lbl{white-space:normal}
  [style*="grid-template-columns:repeat(4"],[style*="grid-template-columns:repeat(3"]{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  [style*="grid-template-columns:1fr 1fr 1fr"]{grid-template-columns:1fr 1fr !important}
  div[style*="columns:2"]{columns:1 !important}
  .cal-head{flex-wrap:wrap}
  .cal-nav{flex-wrap:wrap;margin-left:0;row-gap:6px}
  .pagehead > div[style*="margin-left:auto"],.pagehead > button[style*="margin-left:auto"]{margin-left:0 !important}
  .pagehead > div[style*="display:flex"]{flex-wrap:wrap}
  .notif-row{flex-wrap:wrap}
  .card:has(.tbl){overflow-x:auto}
  .card-pad > div[style*="display:flex"]{flex-wrap:wrap}
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;height:100dvh;width:min(280px,85vw);transform:translateX(-103%);transition:transform .28s var(--ease);z-index:100;box-shadow:0 14px 44px rgba(18,38,31,.4)}
  .rail.open{transform:none}
  .navtoggle{display:inline-flex}
  .topbar{padding:10px 14px;gap:10px}
  .today-chip{display:none}
  .role-select{max-width:130px}
  .search input{width:130px}
  .search input:focus{width:170px}
  .search-results{width:min(360px,calc(100vw - 28px))}
  .view{padding:var(--s-6) 14px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .pagehead{margin-bottom:var(--s-6)}
  .pagehead h1{font-size:var(--fs-2xl)}
  .cal-grid{min-width:680px}
  .modal-back{padding:24px 10px}
  .modal{max-height:90dvh}
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch}
}
@media(max-width:520px){
  .crumb{display:none}
  .search{margin-left:0;flex:1}
  .search input{width:100%}
  .role-select{margin-left:auto}
}

/* ═══ v2: modals, toasts, modules ═══ */
.modal-back{position:fixed;inset:0;background:rgba(18,38,31,.45);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:60px 16px}
.modal-back.open{display:flex}
.modal{background:var(--bone);border-radius:var(--r-xl);box-shadow:0 12px 32px rgba(18,38,31,.2);max-width:600px;width:100%;padding:var(--s-6);max-height:84vh;overflow-y:auto}
.modal h3{font-size:var(--fs-xl);margin-bottom:var(--s-4);font-weight:400}
.toast{position:fixed;right:20px;bottom:20px;background:var(--pine-800);color:var(--bone);padding:12px 18px;border-radius:var(--r-lg);font-size:var(--fs-caption);z-index:120;opacity:0;transform:translateY(8px);transition:all .24s var(--ease);border-left:4px solid var(--verdigris-400);max-width:380px}
.toast.show{opacity:1;transform:none}
.btn-sm{padding:5px 13px;font-size:var(--fs-micro)}
.portal-link{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-micro);font-weight:700;color:var(--st-review-tx);background:var(--st-review-bg);border:1px solid var(--st-review);border-radius:99px;padding:2px 9px;text-decoration:none;white-space:nowrap}
.portal-link:hover{text-decoration:none;filter:brightness(.95)}
.role-select{font-family:var(--font-body);font-size:var(--fs-micro);padding:6px 10px;border:1.5px solid #E0E3D6;border-radius:99px;background:var(--white);color:var(--slategreen);max-width:210px}
.attach-chip{display:inline-flex;font-size:10px;font-weight:600;background:var(--ash);border-radius:var(--r-sm);padding:1px 7px;color:var(--slategreen);margin:2px 3px 0 0}
.minibars{display:flex;align-items:flex-end;gap:3px;height:64px;margin-top:6px}
.minibars .mb{flex:1;background:var(--chart-1);border-radius:3px 3px 0 0;min-height:2px}
.minibars .mb.mtd{opacity:.45}
.emis-input{width:92px;font-family:var(--font-body);font-weight:600;font-variant-numeric:tabular-nums;font-size:var(--fs-caption);padding:5px 8px;border:1.5px solid var(--sagegray);border-radius:var(--r-md)}
.emis-input:focus{outline:none;border-color:var(--verdigris-600)}
.limitbar{height:12px;background:var(--ash);border-radius:99px;overflow:hidden}
.limitbar>div{height:100%;border-radius:99px;transition:width .2s var(--ease)}
.form-row{margin-bottom:var(--s-3)}
.form-row label{display:block;font-size:var(--fs-caption);font-weight:600;color:var(--slategreen);margin-bottom:4px}
.form-row input,.form-row select,.form-row textarea{width:100%;font-family:var(--font-body);font-size:var(--fs-sm);padding:8px 10px;border:1.5px solid var(--sagegray);border-radius:var(--r-md);background:var(--white);box-sizing:border-box}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--verdigris-600)}
.pipe{list-style:none;margin:var(--s-5) 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.pipe li{display:flex;align-items:center;gap:12px;font-size:var(--fs-sm);color:var(--lichen);transition:color .3s}
.pipe li .st{width:22px;height:22px;border-radius:50%;border:2px solid var(--sagegray);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:all .3s}
.pipe li.run{color:var(--pine-800);font-weight:600}
.pipe li.run .st{border-color:var(--verdigris-500);border-top-color:transparent;animation:spin .8s linear infinite}
.pipe li.done{color:var(--slategreen)}
.pipe li.done .st{background:var(--verdigris-500);border-color:var(--verdigris-500);color:var(--bone);animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
.confbar{height:7px;background:var(--ash);border-radius:99px;overflow:hidden;width:90px}
.confbar>div{height:100%;border-radius:99px}
.scope-chip{font-size:var(--fs-micro);font-weight:700;background:var(--copper-200);color:var(--copper-700);border-radius:99px;padding:2px 9px;white-space:nowrap}

@media print{
  .rail,.topbar,.report-toolbar,.toast,.modal-back{display:none !important}
  .shell{display:block}
  .view{padding:0;max-width:100%}
  .report-page{border:none !important;box-shadow:none !important}
  body{background:#fff}
}
.report-page{background:var(--bone);border:1px solid #E0E3D6;border-radius:var(--r-xl);padding:var(--s-10);max-width:900px;margin:0 auto}
.kpi-check{display:flex;gap:8px;align-items:center;font-size:var(--fs-caption);color:var(--slategreen);padding:5px 0;font-weight:400}
</style>

function exportICS(){
  const evs = visObs().filter(o => o.nextDue && days(o.nextDue) >= -7 && days(o.nextDue) <= 180);
  const clean = t => String(t || '').replace(/[\\;,]/g, ' ').replace(/\n/g, ' ');
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Verdacta//Compliance Calendar//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:Verdacta — ' + clean(D.firm.name)];
  evs.forEach(o => { const p = obPermit(o); const c = obClient(o); const d = o.nextDue.replace(/-/g, '');
    lines.push('BEGIN:VEVENT','UID:' + o.id + '@verdacta','DTSTART;VALUE=DATE:' + d,
      'SUMMARY:' + clean('[' + (obSite(o) ? unitName(obSite(o)).split(',')[0] : (c ? c.name.split(',')[0] : 'Internal')) + '] ' + o.title),
      'DESCRIPTION:' + clean((p ? 'Permit ' + p.number : 'Custom task') + (o.citation ? ' · ' + o.citation : '') + ' · ' + o.deadlineRule),
      'BEGIN:VALARM','TRIGGER:-P7D','ACTION:DISPLAY','DESCRIPTION:Due in 7 days','END:VALARM','END:VEVENT'); });
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], {type: 'text/calendar'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'verdacta-compliance-calendar.ics'; a.click();
  toast('✓ ' + evs.length + ' deadlines exported — open the .ics in Outlook, Google, or Apple Calendar');
}

/* derived stats (recomputed — obligations mutate at runtime) */
function calcStats(){
  const obs = acctObs(), permits = acctPermits();
  const arch = D.archivedCompletions.filter(a => { const p = PERMITS[a.permitId]; return !p || inAcct(p.siteId); });
  const docs = D.documents.filter(d => { const p = PERMITS[d.permitId]; return p && inAcct(p.siteId); });
  return {
  due30: obs.filter(o => o.nextDue && days(o.nextDue) >= 0 && days(o.nextDue) <= 30).length,
  due60: obs.filter(o => o.nextDue && days(o.nextDue) >= 0 && days(o.nextDue) <= 60).length,
  overdue: obs.filter(o => o.status === 'overdue').length,
  review: obs.filter(o => o.status === 'review').length,
  permits: permits.length,
  expiring: permits.filter(p => p.status === 'expiring').length,
  openProjects: acctProjects().filter(p => p.status !== 'complete').length,
  activeProjects: acctProjects().filter(p => p.status === 'active').length,
  awaitingAgency: docs.filter(d => d.status === 'submitted' || d.status === 'resubmitted').length,
  openTasks: obs.filter(o => !o.done).length,
  completed: arch.length,
  completionPct: Math.round(arch.length / Math.max(1, arch.length + obs.filter(o => o.status === 'overdue').length) * 100),
  reportsFiled: arch.filter(a => a.title.toLowerCase().includes('report') || a.title.toLowerCase().includes('dmr')).length,
  reportsOnTimePct: (() => { const filed = arch.filter(a => a.title.toLowerCase().includes('report') || a.title.toLowerCase().includes('dmr')); if(!filed.length) return 100; return Math.round(filed.filter(a => !a.late).length / filed.length * 100); })()
}; }

function renewalRunway(){
  const rows = acctPermits().filter(p => p.expires).sort((a,b) => pd(a.expires) - pd(b.expires)).map(p => {
    const total = 5*365, remaining = Math.max(0, days(p.expires));
    const pct = Math.min(100, Math.max(2, Math.round(remaining/total*100)));
    const color = remaining < 240 ? 'var(--st-overdue)' : remaining < 540 ? 'var(--st-due)' : 'var(--verdigris-500)';
    const renewTxt = p.renewalDue ? (days(p.renewalDue) >= 0 ? `renewal app due ${fmtShort(p.renewalDue)} · ${rel(p.renewalDue)}` : `renewal app was due ${fmtShort(p.renewalDue)}`) : (p.status === 'admin-continued' ? 'administratively continued — watch for reissuance' : '');
    return `<div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:var(--fs-micro);margin-bottom:4px">
        <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><a href="#/permit/${p.id}"><b class="mono" style="font-size:var(--fs-micro)">${esc(p.number)}</b></a> <span style="color:var(--fieldgray)">${esc(unitName(siteOf(p)).split(',')[0])}</span></span>
        <span style="color:var(--fieldgray);white-space:nowrap;flex:none;font-weight:600;font-variant-numeric:tabular-nums">exp ${p.expires ? fmtShort(p.expires) + " '" + p.expires.slice(2,4) : '—'}</span>
      </div>
      <div class="runway"><div style="width:${pct}%;background:${color}"></div></div>
      ${renewTxt ? `<div style="font-size:var(--fs-micro);color:${remaining<240 ? 'var(--st-overdue-tx)' : 'var(--fieldgray)'};margin-top:2px">${renewTxt}</div>` : ''}
    </div>`;

}
function activityFeed(items, limit){
  const list = items.sort((a,b) => pd(b.date) - pd(a.date)).slice(0, limit);
  return `<ul class="timeline">${list.map(a => {
    const p = a.permitId ? PERMITS[a.permitId] : null;
    const who = STAFF[a.by] ? STAFF[a.by].name : a.by === 'MDEQ' ? 'MDEQ' : 'Verdacta';
    return `<li class="k-${a.kind}"><span class="dot"></span>
      <span class="t-date">${fmt(a.date)}</span>
      <div class="t-text"><span class="kind-tag ${a.kind}">${a.kind.replace('-',' ')}</span>${esc(a.text)}</div>
      <div class="t-by">${esc(who)}${p ? ` · <a href="#/permit/${p.id}/activity">${esc(p.number)}</a>` : ''}</div></li>`;
  }).join('')}</ul>`;
}
function programChart(scopeObs){
  const progs = ['air','water','stormwater','pretreatment'];
  const counts = progs.map(pr => scopeObs.filter(o => obProgram(o) === pr).length);
  const max = Math.max(...counts, 1);
  const lbl = {air:'Air', water:'NPDES', stormwater:'Stormwater', pretreatment:'Pretreatment'};
  return progs.map((pr,i) => counts[i] ? `<div class="bar-row"><span class="blbl">${lbl[pr]}</span><div class="btrack"><div class="bfill" style="width:${Math.round(counts[i]/max*100)}%"></div></div><span class="bval">${counts[i]}</span></div>` : '').join('');
}

      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px">${ptag(p.program)}${ovd ? chip('overdue', ovd + ' overdue') : due ? chip('due', due + ' due') : chip('compliant','Current')}</div>
      <div class="mono" style="font-size:var(--fs-lg);color:var(--pine-800);font-weight:500">${esc(p.number)}</div>
      <div style="font-size:var(--fs-caption);color:var(--slategreen)">${esc(p.type)}</div>
      <div style="font-size:var(--fs-micro);color:var(--fieldgray);margin-top:8px">Expires <b>${fmt(p.expires)}</b>${p.renewalDue ? ` · renewal due ${fmtShort(p.renewalDue)}` : ''}</div>
      <div style="font-size:var(--fs-micro);color:var(--fieldgray)">${po.length} obligations tracked</div>

  }).join('');
  const next90 = obs.filter(o => o.nextDue && days(o.nextDue) >= -30 && days(o.nextDue) <= 90).sort((a,b) => pd(a.nextDue) - pd(b.nextDue));
  const projCards = projects.map(pr => `
    <div class="card card-pad">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><b style="font-size:var(--fs-caption)">${esc(pr.name)}</b><span class="kind-tag">${pr.status}</span></div>
      <div style="font-size:var(--fs-micro);color:var(--fieldgray);margin-bottom:8px">${pr.permitId ? 'Permit ' + esc(PERMITS[pr.permitId].number) + ' · ' : ''}due ${fmt(pr.due)} · lead ${esc(STAFF[pr.lead].name)}</div>
      <div class="progress"><div style="width:${pr.pctComplete}%"></div></div>
      <div style="font-size:var(--fs-micro);color:var(--fieldgray);margin-top:4px">${pr.pctComplete}% · ${esc(pr.notes)}</div>
    </div>`).join('');
  $('#view').innerHTML = `
    <div class="breadcrumbs"><a href="#/">Dashboard</a> › ${u ? `<a href="${u.link}">${esc(u.name)}</a> › ` : ''}${esc(s.name)}</div>
    <div class="pagehead"><div><h1>${esc(s.name)}</h1><div class="sub">${esc(s.city)}, ${esc(s.county)} County, MS${s.receivingStream ? ' · receiving stream: ' + esc(s.receivingStream) : ''} — ${esc(s.description)}</div></div></div>
    <div class="section-label">Permits at this site <button class="btn btn-ghost btn-sm" style="margin-left:8px" onclick="openUploadPermit()">⤒ Upload permit</button></div>
    <div class="grid" style="grid-template-columns:repeat(${Math.min(permits.length,3)},1fr);margin-bottom:var(--s-6)">${permitCards}</div>
    <div class="two-col">
      <div>
        <div class="section-label">Site deadlines · trailing 30 / next 90 days</div>
        <div class="card">${needsAttentionRows(next90)}</div>
      </div>
      <div>
        ${projects.length ? `<div class="section-label">Projects</div><div class="grid">${projCards}</div>` : ''}
        <div class="section-label" style="margin-top:${projects.length ? 'var(--s-6)' : '0'}">Recent documents</div>

/* ═══════════ PERMIT DETAIL ═══════════ */
function viewPermit(pid, tab){
  const p = PERMITS[pid]; if(!p || !inAcct(p.siteId)) return viewFirm();
  const s = siteOf(p), c = clientOf(p);
  const u = topUnit(s);
  const obs = permitObs(pid);
  const docs = D.documents.filter(d => d.permitId === pid).sort((a,b) => pd(b.date) - pd(a.date));
  const acts = D.activity.filter(a => a.permitId === pid).sort((a,b) => pd(b.date) - pd(a.date));
  const notifs = D.notifications.filter(n => n.permitId === pid).sort((a,b) => pd(b.date) - pd(a.date));
  const projs = D.projects.filter(pr => pr.permitId === pid);
  setCrumb(`${u ? `<a href="${u.link}">${esc(u.name)}</a> › ` : ''}<a href="#/site/${s.id}">${esc(s.name)}</a> › <b class="mono">${esc(p.number)}</b>`);
  const statusChip = p.status === 'expiring' ? chip('due','Renewal window open') : p.status === 'admin-continued' ? chip('review','Administratively continued') : chip('compliant','Active');
  const renewBlock = p.renewalDue ? `<div class="m"><div class="k">Renewal app due</div><div class="v" style="color:${days(p.renewalDue) <= 60 ? 'var(--st-overdue)' : 'var(--ink)'}">${fmt(p.renewalDue)}${days(p.renewalDue) >= 0 ? ' · ' + rel(p.renewalDue) : ''}</div></div>` : '';
  const tabBtn = (key, lbl, ct) => `<button class="${tab === key ? 'active' : ''}" onclick="go('#/permit/${pid}/${key}')">${lbl}${ct != null ? `<span class="ct">${ct}</span>` : ''}</button>`;
  let body = '';
  if(tab === 'obligations') body = tabObligations(p, obs);
  else if(tab === 'documents') body = tabDocuments(p, docs);
  else if(tab === 'activity') body = `<div class="card card-pad">${acts.length ? `<ul class="timeline">${acts.map(a => {
      const who = STAFF[a.by] ? STAFF[a.by].name : a.by === 'MDEQ' ? 'MDEQ — Office of Pollution Control' : 'Verdacta';
      return `<li class="k-${a.kind}"><span class="dot"></span><span class="t-date">${fmt(a.date)}</span>
        <div class="t-text"><span class="kind-tag ${a.kind}">${a.kind.replace('-',' ')}</span>${esc(a.text)}</div><div class="t-by">${esc(who)}</div></li>`;
    }).join('')}</ul>` : '<div class="empty">No activity logged.</div>'}</div>`;
  else if(tab === 'conditions') body = tabConditions(p);
  else if(tab === 'deviations') body = `<div style="display:flex;justify-content:flex-end;margin-bottom:var(--s-4)"><button class="btn btn-danger" onclick="openLogDeviation('${p.id}')">+ Log event</button></div><div class="card" style="overflow-x:auto">${devTable(D.deviations.filter(d => d.permitId === p.id).sort((a,b) => pd(b.date) - pd(a.date)))}</div>`;
  else if(tab === 'notifications') body = tabPermitNotifs(p, obs, notifs);
  else if(tab === 'emissions') body = tabEmissions(p);
  else if(tab === 'archive') body = tabArchive(p);
  else { tab = 'obligations'; body = tabObligations(p, obs); }
  $('#view').innerHTML = `
    <div class="breadcrumbs"><a href="#/">Dashboard</a> › ${u ? `<a href="${u.link}">${esc(u.name)}</a> › ` : ''}<a href="#/site/${s.id}">${esc(s.name)}</a> › ${esc(p.number)}</div>
    <div class="card card-pad" style="margin-bottom:var(--s-2)">
      <div style="display:flex;gap:var(--s-4);align-items:flex-start;flex-wrap:wrap">
        <div style="flex:1;min-width:300px">
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${ptag(p.program)}${statusChip}</div>
          <h1 style="font-family:var(--font-body);font-weight:700;font-variant-numeric:tabular-nums;font-size:var(--fs-2xl);letter-spacing:.01em;margin-top:10px;color:var(--pine-800)">${esc(p.number)}</h1>
          <div style="font-size:var(--fs-base);color:var(--slategreen)">${esc(p.type)}</div>
          <div style="font-size:var(--fs-caption);color:var(--fieldgray);margin-top:4px">${esc(p.description)}</div>
          <div style="margin-top:8px">${cite(p.renewalRule, true)}</div>
        </div>
        <div style="min-width:120px">${projs.map(pr => `<div class="card card-pad" style="background:var(--pine-100);border-color:var(--pine-300);margin-bottom:8px">
          <div style="font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.1em;color:var(--pine-700);font-weight:700">Active project</div>
          <b style="font-size:var(--fs-caption)">${esc(pr.name)}</b>
          <div class="progress" style="margin-top:6px"><div style="width:${pr.pctComplete}%"></div></div>
          <div style="font-size:var(--fs-micro);color:var(--fieldgray);margin-top:3px">${pr.pctComplete}% · due ${fmtShort(pr.due)} · ${esc(STAFF[pr.lead].initials)}</div>
        </div>`).join('')}</div>
      </div>
      <div class="meta-grid">
        <div class="m"><div class="k">Agency</div><div class="v" style="font-family:var(--font-body)">${esc(p.agency)}</div></div>
        <div class="m"><div class="k">Issued</div><div class="v">${fmt(p.issued)}</div></div>
        <div class="m"><div class="k">Effective</div><div class="v">${fmt(p.effective)}</div></div>
        <div class="m"><div class="k">Expires</div><div class="v">${fmt(p.expires)}</div></div>
        ${renewBlock}
      </div>
    </div>
    <div class="tabs">
      ${tabBtn('obligations','Obligations', obs.length)}
      ${tabBtn('documents','Documents', docs.length)}
      ${tabBtn('activity','Activity', acts.length)}
      ${tabBtn('conditions','Limits & conditions', null)}
      ${D.emissions.some(e => e.permitId === pid) ? tabBtn('emissions','Emissions ▦', null) : ''}
      ${tabBtn('deviations','Deviations', D.deviations.filter(d => d.permitId === pid).length)}
      ${tabBtn('notifications','Notifications', notifs.length)}
      ${tabBtn('archive','Archive', D.archivedCompletions.filter(a => a.permitId === pid).length)}
    </div>
    ${body}`;
}
function tabObligations(p, obs){
  const order = {overdue:0, due:1, review:2, compliant:3};
  const sorted = [...obs].sort((a,b) => (order[a.status] - order[b.status]) || ((a.nextDue?pd(a.nextDue):Infinity) - (b.nextDue?pd(b.nextDue):Infinity)));
  return `<div class="card" style="overflow-x:auto"><table class="tbl" style="table-layout:fixed;min-width:1000px">
    <colgroup><col style="width:28%"><col style="width:10%"><col style="width:7%"><col style="width:16%"><col style="width:10%"><col style="width:5%"><col style="width:12%"><col style="width:12%"></colgroup>
    <thead><tr><th>Obligation</th><th>Category</th><th>Frequency</th><th>Citation</th><th>Next due</th><th>Owner</th><th style="text-align:right">Status</th><th style="text-align:right">Action</th></tr></thead>
    <tbody>${sorted.map(o => `<tr class="${o.status === 'overdue' ? 'ovd' : ''}">
      <td><b>${esc(o.title)}</b>${evidenceCount(o.id) ? ` <a href="#/permit/${p.id}/documents" onclick="event.stopPropagation()" class="kind-tag" style="background:var(--verdigris-100);color:var(--verdigris-800);text-decoration:none">⎙ ${evidenceCount(o.id)}</a>` : ''}<br><span style="font-size:var(--fs-micro);color:var(--fieldgray)">${esc(o.deadlineRule)}</span>${o.notes ? `<br><span style="font-size:var(--fs-micro);color:var(--slategreen);font-style:italic">${esc(o.notes)}</span>` : ''}</td>
      <td><span class="kind-tag">${esc(o.category)}</span></td>
      <td style="font-size:var(--fs-micro)">${esc(o.frequency)}</td>
      <td>${cite(o.citation)}</td>
      <td>${duecell(o.nextDue)}</td>
      <td>${av(o.assignee)}</td>
      <td style="text-align:right">${obChip(o)}</td>
      <td style="text-align:right;white-space:nowrap">${portalBtn(o)} ${o.done ? `<span class="chip compliant"><span class="ic"></span>✓ Completed${o.lastCompleted ? ' · ' + fmtShort(o.lastCompleted) : ''}</span>` : `<button class="btn btn-ghost btn-sm" onclick="openComplete('${o.id}')">Mark complete</button>${o.lastCompleted ? `<div style="font-size:10px;color:var(--lichen);margin-top:3px">last done ${fmtShort(o.lastCompleted)}</div>` : ''}`}</td>
    </tr>`).join('')}</tbody></table></div>`;
}
function tabDocuments(p, docs){
  return `<div class="two-col"><div class="card">${docs.map(docRow).join('') || '<div class="empty">No documents.</div>'}</div>
  <div>
    <div class="card card-pad" style="border-style:dashed;text-align:center;background:var(--verdigris-100);border-color:var(--verdigris-300)">
      <div style="font-family:var(--font-display);font-size:var(--fs-2xl);color:var(--verdigris-600)">§</div>

/* ═══════════ CALENDAR ═══════════ */
let calY = 2026, calM = 7; // August 2026
function calShift(d){ calM += d; if(calM < 0){calM = 11; calY--;} if(calM > 11){calM = 0; calY++;} viewCalendar(); }
function viewCalendar(){
  setCrumb(`<b>${esc(D.firm.name)}</b> · Compliance calendar`);
  const first = new Date(calY, calM, 1);
  const startDow = first.getDay();
  const dim = new Date(calY, calM + 1, 0).getDate();
  const cells = [];
  const prevDim = new Date(calY, calM, 0).getDate();
  for(let i = 0; i < startDow; i++) cells.push({d: prevDim - startDow + 1 + i, dim: true});
  for(let d = 1; d <= dim; d++) cells.push({d, dim: false});
  while(cells.length % 7) cells.push({d: cells.length - startDow - dim + 1, dim: true});
  const iso = d => `${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const obsByDay = {};
  visObs().forEach(o => { if(o.nextDue) (obsByDay[o.nextDue] = obsByDay[o.nextDue] || []).push(o); });
  acctProjects().filter(pr => pr.status !== 'complete').forEach(pr => { (obsByDay[pr.due] = obsByDay[pr.due] || []).push({project: true, pr}); });
  const monthItems = D.obligations.filter(o => o.nextDue && o.nextDue.startsWith(`${calY}-${String(calM+1).padStart(2,'0')}`)).length;
  const grid = cells.map(c => {
    if(c.dim) return `<div class="cal-cell dim"><div class="cal-date">${c.d}</div></div>`;
    const key = iso(c.d);
    const items = obsByDay[key] || [];
    const isToday = key === D.today;
    const pills = items.slice(0,3).map(it => {
      if(it.project) return `<span class="pill project" onclick="go('#/site/${it.pr.siteId}')" title="${esc(it.pr.name)}">◳ ${esc(it.pr.name)}</span>`;
      const c = obClient(it);
      return `<span class="pill ${it.status}" onclick="go('${obLink(it)}')" title="${esc(it.title)}${c ? ' — ' + esc(c.name) : ''}">${esc(it.title)}</span>`;
    }).join('');
    const more = items.length > 3 ? `<span style="color:var(--fieldgray)">+ ${items.length - 3} more</span>` : '';
    return `<div class="cal-cell ${isToday ? 'today' : ''}"><div class="cal-date">${c.d}</div>${pills}${more}</div>`;
  }).join('');
  $('#view').innerHTML = `
    <div class="pagehead"><div><h1>Compliance calendar</h1><div class="sub">Every dated obligation and project milestone across the portfolio. Click a pill to open its permit.</div></div></div>
    <div class="cal-head">
      <span class="cal-title">${['January','February','March','April','May','June','July','August','September','October','November','December'][calM]} ${calY}</span>
      <span style="font-size:var(--fs-micro);color:var(--fieldgray)">${monthItems} deadline${monthItems === 1 ? '' : 's'} this month</span>
      <div class="cal-nav">
        <button class="btn btn-primary" onclick="openAddTask()">+ Add task</button>
        <button class="btn btn-ghost" onclick="exportICS()">⤓ Export .ics</button>
        <button class="btn btn-ghost" onclick="calShift(-1)">‹ Prev</button>
        <button class="btn btn-ghost" onclick="calY=2026;calM=7;viewCalendar()">Today</button>
        <button class="btn btn-ghost" onclick="calShift(1)">Next ›</button>
      </div>
    </div>
    <div class="cal-scroll"><div class="cal-grid">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="cal-dow">${d}</div>`).join('')}
      ${grid}

  m.status = 'closed';
  D.wasteActivity.unshift({ id: 'wa-r' + Date.now(), siteId: m.siteId, date: D.today, text: 'Signed TSDF return copy received and filed for manifest ' + m.manifestNo + ' — tracking closed by ' + me().name + '.', by: S.role });

}

function confirmDetermination(){
  const name = $('#wd-name').value.trim();
  if(!name){ toast('Name the waste stream.'); return; }
  const codes = [];
  if($('#wd-d001').checked) codes.push('D001');
  if($('#wd-d002').checked) codes.push('D002');
  if($('#wd-d003').checked) codes.push('D003');
  if($('#wd-tox').checked) codes.push('D004+');
  ($('#wd-listed').value || '').split(/[\s,]+/).filter(x => /^[FKPU]\d{3}$/i.test(x)).forEach(x => codes.push(x.toUpperCase()));
  const w = { id: 'wp-r' + Date.now(), siteId: $('#wd-site').value, name,
    epaCodes: codes, classification: codes.length ? 'hazardous' : 'non-hazardous',
    container: $('#wd-container').value.trim() || 'TBD', annualEstimate: $('#wd-est').value.trim() || 'TBD', status: 'active',
    determination: { basis: $('#wd-basis').value, process: $('#wd-process').value.trim(), date: D.today, by: S.role } };
  D.wasteProfiles.push(w);
  D.wasteActivity.unshift({ id: 'wa-r' + Date.now(), siteId: w.siteId, date: D.today, text: 'Waste determination saved for "' + name + '" — ' + (codes.length ? codes.join('/') + ' hazardous' : 'non-hazardous') + ' per 40 CFR 262.11 (' + $('#wd-basis').value.toLowerCase() + ').', by: S.role });
  closeModal(); toast('✓ Determination saved — profile active' + (codes.length ? ' · ' + codes.join(', ') : ' · non-hazardous')); viewWaste();
}

/* ═══════════ EMISSIONS TAB ═══════════ */
function monthLabel(m){ const [y, mm] = m.split('-'); return MON[Number(mm) - 1] + ' ' + y.slice(2); }
function emisCalc(u){
  const months = [...u.throughput].sort((a,b) => a.month.localeCompare(b.month));
  const last12 = months.slice(-12);
  return u.factors.map(f => {
    const monthly = months.map(t => ({ month: t.month, tons: t.value * f.factor / 2000 }));
    const roll = last12.reduce((acc, t) => acc + t.value * f.factor / 2000, 0);
    return { f, monthly, roll, pct: f.limitTpy ? roll / f.limitTpy * 100 : null };
  });
}
function tabEmissions(p){
  const em = D.emissions.find(e => e.permitId === p.id);
  if(!em) return '<div class="empty">No emission tracking configured for this permit.</div>';
  return `<div class="grid">${em.units.map(u => emisUnitCard(u)).join('')}
    <p style="font-size:var(--fs-micro);color:var(--fieldgray)">Edit a throughput value and the calculations update instantly — deterministic factor × throughput math, never estimated by AI. Factors carry their source; the production build locks them behind reviewer approval and accepts CSV/meter uploads.</p></div>`;
}
function emisUnitCard(u){
  const calcs = emisCalc(u);
  const months = [...u.throughput].sort((a,b) => a.month.localeCompare(b.month));
  const editable = months.slice(-3);
  return `<div class="card card-pad" id="emis-${u.id}">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px">
      <div><h3 style="font-size:var(--fs-xl);font-weight:400">${esc(u.name)}</h3>
      <div style="font-size:var(--fs-caption);color:var(--fieldgray)">${esc(u.description)}</div></div>
      <button class="btn btn-ghost btn-sm" onclick="toast('Prototype: production build accepts CSV / historian / meter data uploads here.')">⤒ Upload throughput data</button>
    </div>
    <div class="two-col" style="margin-top:var(--s-4)">
      <div>
        ${calcs.map((c, ci) => `
          <div style="margin-bottom:var(--s-5)">
            <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px">
              <b style="font-size:var(--fs-sm)">${esc(c.f.pollutant)} — 12-month rolling</b>
              <span class="mono" style="font-size:var(--fs-caption)"><span id="roll-${u.id}-${ci}">${c.roll.toFixed(1)}</span>${c.f.limitTpy ? ' / ' + c.f.limitTpy : ''} tpy</span>
            </div>
            ${c.f.limitTpy ? `<div class="limitbar" style="margin:6px 0 2px"><div id="bar-${u.id}-${ci}" style="width:${Math.min(100, c.pct)}%;background:${c.pct >= 95 ? 'var(--st-overdue)' : c.pct >= 80 ? 'var(--st-due)' : 'var(--verdigris-500)'}"></div></div>
            <div style="display:flex;justify-content:space-between;font-size:var(--fs-micro);color:var(--fieldgray)"><span id="pct-${u.id}-${ci}">${c.pct.toFixed(1)}% of limit</span><span>${esc(c.f.limitBasis || '')}</span></div>` : ''}
            <div style="font-size:var(--fs-micro);color:var(--fieldgray);margin-top:4px">Factor: <span class="mono">${c.f.factor} ${esc(c.f.factorUnits)}</span> · <span class="cite">${esc(c.f.source)}</span></div>
            <div class="minibars" id="bars-${u.id}-${ci}">${emisBars(c)}</div>
            <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--lichen)"><span>${monthLabel(c.monthly[0].month)}</span><span>${monthLabel(c.monthly[c.monthly.length-1].month)} (MTD)</span></div>
          </div>`).join('')}
      </div>
      <div>
        <div class="section-label">${esc(u.throughputLabel)} · ${esc(u.throughputUnits)}</div>
        <table class="tbl">${months.slice(-6).map(t => { const isEdit = editable.some(e => e.month === t.month);
          return `<tr><td class="mono" style="font-size:var(--fs-micro)">${monthLabel(t.month)}</td>
          <td style="text-align:right">${isEdit ? `<input class="emis-input" type="number" value="${t.value}" oninput="emisUpdate('${u.id}','${t.month}', this.value)">` : `<span class="mono" style="font-size:var(--fs-caption)">${t.value.toLocaleString()}</span>`}</td></tr>`; }).join('')}</table>
        ${u.notes ? `<p style="font-size:var(--fs-micro);color:var(--fieldgray);margin-top:8px">${esc(u.notes)}</p>` : ''}
      </div>
    </div>
  </div>`;
}
function emisBars(c){
  const max = Math.max(...c.monthly.map(m => m.tons), 0.001);
  return c.monthly.map((m, i) => `<div class="mb ${i === c.monthly.length - 1 ? 'mtd' : ''}" style="height:${Math.max(3, m.tons / max * 100)}%" title="${monthLabel(m.month)}: ${m.tons.toFixed(2)} tons"></div>`).join('');
}
function emisUpdate(uid, month, val){
  const u = D.emissions.flatMap(e => e.units).find(x => x.id === uid);
  const t = u.throughput.find(x => x.month === month);
  t.value = Number(val) || 0;
  emisCalc(u).forEach((c, ci) => {
    const roll = document.getElementById('roll-' + uid + '-' + ci);
    if(roll) roll.textContent = c.roll.toFixed(1);
    const bar = document.getElementById('bar-' + uid + '-' + ci);
    if(bar && c.f.limitTpy){ bar.style.width = Math.min(100, c.pct) + '%'; bar.style.background = c.pct >= 95 ? 'var(--st-overdue)' : c.pct >= 80 ? 'var(--st-due)' : 'var(--verdigris-500)'; }
    const pct = document.getElementById('pct-' + uid + '-' + ci);
    if(pct && c.pct != null) pct.textContent = c.pct.toFixed(1) + '% of limit' + (c.pct >= 95 ? ' — over the compliance margin' : c.pct >= 80 ? ' — inside the caution band' : '');
    const bars = document.getElementById('bars-' + uid + '-' + ci);
    if(bars) bars.innerHTML = emisBars(c);
  });
}

function dvPermitChanged(){

function confirmLogDeviation(){

  D.activity.unshift({ id: 'act-src-' + P.id + '-2', permitId: P.id, date: D.today, kind: 'status-change', text: 'Extraction approved by ' + me().name + ' — ' + (PENDING.obligations.length - declinedN - held) + ' obligations published to the live register' + (held ? ', ' + held + ' held for manual interpretation' : '') + (declinedN ? ', ' + declinedN + ' declined by the reviewer' : '') + (PENDING.emissions ? '; emission calculators configured' : '') + '.', by: S.role });
  D.activity.unshift({ id: 'act-src-' + P.id + '-1', permitId: P.id, date: D.today, kind: 'upload', text: PENDING.fileName + ' uploaded and extracted (' + PENDING.obligations.length + ' draft obligations).', by: S.role });
  const num = P.number;
  PENDING = null;
  toast('✓ ' + num + ' published — client, site, tasks, and calendar are live');

}

  ['ontime', 'Reports on time (YTD)', 'kpi'], ['exceed', 'Permit exceedances (YTD)', 'kpi'], ['dev', 'Deviations (YTD)', 'kpi'],

  'Evidence & completions': ['opentasks','inspections','tbl-completions']
};
const R = { scope: 'account', period: 'YTD 2026', kpis: new Set(REPORT_TEMPLATES['Compliance summary']) };
function reportScopes(){
  const out = [['account|', acct().name + ' — everything']];
  if(acct().kind === 'consulting') activeClients().forEach(c => out.push(['client|' + c.id, 'Client · ' + c.name]));
  else acctGroups().forEach(g => out.push(['group|' + g.id, acct().groupLabel.replace(/s$/,'') + ' · ' + g.name]));
  visSites().forEach(st => out.push(['site|' + st.id, 'Site · ' + st.name]));
  return out;
}
function scopeSiteIds(){
  const [kind, id] = R.scope.split('|');
  if(kind === 'client') return D.sites.filter(st => st.clientId === id).map(st => st.id);
  if(kind === 'group'){ const g = D.groups.find(x => x.id === id); return g ? g.siteIds : []; }
  if(kind === 'site') return [id];
  return acctSiteIds();
}
function scopeName(){
  const [kind, id] = R.scope.split('|');
  if(kind === 'client') return CLIENTS[id].name;
  if(kind === 'group') return D.groups.find(x => x.id === id).name;
  if(kind === 'site') return SITES[id].name;
  return acct().name;
}
function scopedData(){
  const ids = scopeSiteIds();
  const obs = D.obligations.filter(o => { const st = obSite(o); return st && ids.includes(st.id); });
  const permits = D.permits.filter(p => ids.includes(p.siteId));
  const arch = D.archivedCompletions.filter(a => { const p = PERMITS[a.permitId]; return p && ids.includes(p.siteId); });
  const docs = D.documents.filter(d => { const p = PERMITS[d.permitId]; return p && ids.includes(p.siteId); });
  const mans = D.wasteManifests.filter(m => ids.includes(m.siteId));
  const open = obs.filter(o => !o.done);
  const filedReports = arch.filter(a => a.title.toLowerCase().includes('report') || a.title.toLowerCase().includes('dmr'));
  return { ids, obs, permits, arch, docs, mans, open,
    overdue: open.filter(o => o.status === 'overdue'),
    due30: open.filter(o => o.nextDue && days(o.nextDue) >= 0 && days(o.nextDue) <= 30),
    due60: open.filter(o => o.nextDue && days(o.nextDue) >= 0 && days(o.nextDue) <= 60),
    completionPct: Math.round(arch.length / Math.max(1, arch.length + open.filter(o => o.status === 'overdue').length) * 100),
    onTimePct: filedReports.length ? Math.round(filedReports.filter(a => !a.late).length / filedReports.length * 100) : 100,
    filed: filedReports.length,
    awaiting: docs.filter(d => d.status === 'submitted' || d.status === 'resubmitted').length,
    inspections: docs.filter(d => d.docType === 'inspection').length + D.planInspections.filter(i => { if(days(i.date) < -90) return false; if(i.planId){ const pl = D.plans.find(x => x.id === i.planId); return pl && ids.includes(pl.siteId); } return false; /* permit-linked inspections are counted via their document entry */ }).length,
    shipments: mans.filter(m => m.shipDate.startsWith('2026')).length,
    exceptions: mans.filter(m => m.status === 'exception').length };
}

const SNAP_V = 10;
const DEMO_MODE = localStorage.getItem('verdacta-mode') || 'seeded';
function stateKey(){ return 'verdacta-state-v' + SNAP_V + '-' + DEMO_MODE; }
function applyCleanMode(){
  ['documents','archivedCompletions','activity','notifications','wasteManifests','wasteActivity','wasteProfiles','planInspections','plans','projects','deviations','permits','obligations','emissions'].forEach(k => { D[k].length = 0; });
  D.metrics.exceedancesYTD = 0;
  rebuildIdx();
}
function saveState(){
  try{ localStorage.setItem(stateKey(), JSON.stringify({ v: SNAP_V,
    obligations: D.obligations, documents: D.documents, archivedCompletions: D.archivedCompletions, activity: D.activity,
    notifications: D.notifications, wasteProfiles: D.wasteProfiles, wasteManifests: D.wasteManifests, wasteActivity: D.wasteActivity,
    planInspections: D.planInspections, plans: D.plans, projects: D.projects, deviations: D.deviations, permits: D.permits, emissions: D.emissions,
    metrics: D.metrics, prefs: PREFS, s: { role: S.role, account: S.account, adhocN: S.adhocN } })); }catch(e){}
}
function restoreState(){
  const raw = localStorage.getItem(stateKey()); if(!raw) return;
  try{ const st = JSON.parse(raw); if(st.v !== SNAP_V) return;
    ['obligations','documents','archivedCompletions','activity','notifications','wasteProfiles','wasteManifests','wasteActivity','planInspections','plans','projects','deviations','permits','emissions'].forEach(k => { if(st[k]) D[k] = st[k]; });
    if(st.metrics) D.metrics = st.metrics;
    if(st.prefs) Object.keys(st.prefs).forEach(k => PREFS[k] = st.prefs[k]);
    if(st.s){ S.role = st.s.role; S.account = st.s.account; S.adhocN = st.s.adhocN || 0; }
    rebuildIdx();
  }catch(e){}
}
function setDemoMode(m){ localStorage.setItem('verdacta-mode', m); location.reload(); }
function resetDemo(){ localStorage.removeItem(stateKey()); toast('Demo data reset — reloading'); setTimeout(() => location.reload(), 500); }

restoreState();
