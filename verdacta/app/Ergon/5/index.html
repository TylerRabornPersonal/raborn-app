  'Noncompliance log': ['dev','exceed','tbl-deviations'],
  'Evidence & completions': ['opentasks','inspections','tbl-completions']
};
const R = { scope: 'account', period: 'YTD 2026', kpis: new Set(REPORT_TEMPLATES['Compliance summary']) };
function reportScopes(){
  const out = [['account|', acct().name + ' — everything']];
  if(acct().kind === 'consulting') activeClients().forEach(c => out.push(['client|' + c.id, 'Client · ' + c.name]));
  else acctGroups().forEach(g => out.push(['group|' + g.id, acct().groupLabel.replace(/s$/,'') + ' · ' + g.name]));
  visSites().forEach(st => out.push(['site|' + st.id, 'Site · ' + st.name]));
  return out;
}
function scopeSiteIds(){
  const [kind, id] = R.scope.split('|');
  if(kind === 'client') return D.sites.filter(st => st.clientId === id).map(st => st.id);
  if(kind === 'group'){ const g = D.groups.find(x => x.id === id); return g ? g.siteIds : []; }
  if(kind === 'site') return [id];
  return acctSiteIds();
}
function scopeName(){
  const [kind, id] = R.scope.split('|');
  if(kind === 'client') return CLIENTS[id].name;
  if(kind === 'group') return D.groups.find(x => x.id === id).name;
  if(kind === 'site') return SITES[id].name;
  return acct().name;
}
function scopedData(){
  const ids = scopeSiteIds();
  const obs = D.obligations.filter(o => { const st = obSite(o); return st && ids.includes(st.id); });
  const permits = D.permits.filter(p => ids.includes(p.siteId));
  const arch = D.archivedCompletions.filter(a => { const p = PERMITS[a.permitId]; return p && ids.includes(p.siteId); });
  const docs = D.documents.filter(d => { const p = PERMITS[d.permitId]; return p && ids.includes(p.siteId); });
  const mans = D.wasteManifests.filter(m => ids.includes(m.siteId));
  const open = obs.filter(o => !o.done);
  const filedReports = arch.filter(a => a.title.toLowerCase().includes('report') || a.title.toLowerCase().includes('dmr'));
  return { ids, obs, permits, arch, docs, mans, open,
    overdue: open.filter(o => o.status === 'overdue'),
    due30: open.filter(o => o.nextDue && days(o.nextDue) >= 0 && days(o.nextDue) <= 30),
    due60: open.filter(o => o.nextDue && days(o.nextDue) >= 0 && days(o.nextDue) <= 60),
    completionPct: Math.round(arch.length / Math.max(1, arch.length + open.filter(o => o.status === 'overdue').length) * 100),
    onTimePct: filedReports.length ? Math.round(filedReports.filter(a => !a.late).length / filedReports.length * 100) : 100,
    filed: filedReports.length,
    awaiting: docs.filter(d => d.status === 'submitted' || d.status === 'resubmitted').length,
    inspections: docs.filter(d => d.docType === 'inspection').length + D.audits.filter(a => ids.includes(a.siteId) && days(a.date) >= -90).length,
    auditFindingsOpen: D.audits.filter(a => ids.includes(a.siteId)).reduce((n, a) => n + a.findings.filter(f => f.status === 'open').length, 0),
    shipments: mans.filter(m => m.shipDate.startsWith('2026')).length,
    exceptions: mans.filter(m => m.status === 'exception').length };
}

        <div class="card card-pad">
          <b style="font-size:var(--fs-caption)">KPIs</b>
          <div style="columns:2;margin:6px 0 14px">${KPI_CATALOG.filter(k => k[2] === 'kpi').map(([id, l]) => `<label class="kpi-check"><input type="checkbox" ${has(id) ? 'checked' : ''} onchange="this.checked ? R.kpis.add('${id}') : R.kpis.delete('${id}'); viewReports()">${l}</label>`).join('')}</div>
          <b style="font-size:var(--fs-caption)">Detail sections</b>
          <div style="margin-top:6px">${KPI_CATALOG.filter(k => k[2] === 'section').map(([id, l]) => `<label class="kpi-check"><input type="checkbox" ${has(id) ? 'checked' : ''} onchange="this.checked ? R.kpis.add('${id}') : R.kpis.delete('${id}'); viewReports()">${l}</label>`).join('')}</div>
        </div>
        <div style="display:flex;gap:10px;margin-top:var(--s-5)">
          <button class="btn btn-primary" onclick="genReport()">Generate report</button>
          <span style="font-size:var(--fs-micro);color:var(--fieldgray);align-self:center">Scoped to <b>${esc(scopeName())}</b> · ${esc(R.period)}</span>
        </div>
      </div>
    </div>`;
}
function reportKpiTile(lbl, val, sub, color){
  return `<div style="border:1px solid #E0E3D6;border-radius:12px;padding:16px 18px">
    <div style="font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#737B6E;margin-bottom:2px">${lbl}</div>
    <div style="font-family:Spectral,Georgia,serif;font-size:2rem;font-weight:300;line-height:1.05;color:${color || '#24493A'}">${val}</div>
    ${sub ? `<div style="font-size:10.5px;color:#737B6E">${sub}</div>` : ''}</div>`;
}
function reportTable(headers, rows){
  return `<table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:8px">
    <thead><tr>${headers.map(h => `<th style="text-align:left;padding:7px 10px;font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:#4E564E;background:#E4E7DB">${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(cell => `<td style="padding:8px 10px;border-top:1px solid #E4E7DB;vertical-align:top">${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function reportHTML(){
  const d = scopedData();
  const has = id => R.kpis.has(id);
  const tiles = [];
  if(has('pastdue')) tiles.push(reportKpiTile('Past due', d.overdue.length, 'needs action', d.overdue.length ? '#B03A26' : '#3A7D34'));
  if(has('opentasks')) tiles.push(reportKpiTile('Open tasks', d.open.length, d.arch.length + ' completed · ' + d.completionPct + '% completion'));
  if(has('due30')) tiles.push(reportKpiTile('Due ≤ 30 days', d.due30.length, d.due60.length + ' within 60'));
  if(has('ontime')) tiles.push(reportKpiTile('Reports on time', d.onTimePct + '%', d.filed + ' filed YTD', d.onTimePct < 95 ? '#7A5210' : '#3A7D34'));
  if(has('exceed')) tiles.push(reportKpiTile('Permit exceedances', D.metrics.exceedancesYTD, 'YTD — no limits exceeded', '#3A7D34'));
  const scopedDevs = D.deviations.filter(x => { const st = devSite(x); return st && scopeSiteIds().includes(st.id); });
  if(has('dev')) tiles.push(reportKpiTile('Deviations', scopedDevs.length, scopedDevs.filter(x => x.status === 'open' || x.status === 'corrective-action').length ? scopedDevs.filter(x => x.status === 'open' || x.status === 'corrective-action').length + ' open' : 'YTD — all reported & closed', scopedDevs.some(x => x.status === 'open') ? '#B03A26' : '#7A5210'));
  if(has('permits')) tiles.push(reportKpiTile('Permits', d.permits.length, d.permits.filter(p => p.status === 'expiring').length + ' in renewal window'));
  if(has('agency')) tiles.push(reportKpiTile('Awaiting agency', d.awaiting, 'submittals pending'));
  if(has('inspections')) tiles.push(reportKpiTile('Audits & inspections', d.inspections, 'trailing 90 days · ' + d.auditFindingsOpen + ' open finding' + (d.auditFindingsOpen === 1 ? '' : 's'), d.auditFindingsOpen ? '#B03A26' : undefined));
  if(has('waste')) tiles.push(reportKpiTile('Waste shipments', d.shipments, d.exceptions + ' return-copy exception' + (d.exceptions === 1 ? '' : 's'), d.exceptions ? '#B03A26' : '#24493A'));
  const secs = [];
  const sec = (title, inner) => `<div style="margin-top:26px"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#285A50;font-weight:700;border-bottom:1px solid #E4E7DB;padding-bottom:5px">${title}</div>${inner}</div>`;
  if(has('tbl-overdue')) secs.push(sec('Overdue items', d.overdue.length ? reportTable(['Item','Where','Due','Days over'],
    d.overdue.map(o => [`<b>${esc(o.title)}</b>`, obPath(o), fmt(o.nextDue), String(-days(o.nextDue))])) : '<p style="font-size:12px;color:#3A7D34;margin-top:8px">Nothing overdue — clean slate.</p>'));
  if(has('tbl-upcoming')) secs.push(sec('Deadlines · next 30 days', reportTable(['Item','Where','Citation','Due'],
    d.due30.sort((a,b) => pd(a.nextDue) - pd(b.nextDue)).slice(0, 15).map(o => [`<b>${esc(o.title)}</b>`, obPath(o), o.citation ? esc(o.citation) : '—', fmt(o.nextDue) + ' <span style="color:#737B6E">(' + rel(o.nextDue) + ')</span>']))));
  if(has('tbl-completions')) secs.push(sec('Recent completions — evidence on file', reportTable(['Completed item','Date','By','Evidence'],
    d.arch.slice(0, 10).map(a => [`<b>${esc(a.title)}</b>`, fmt(a.completedOn), esc(STAFF[a.completedBy] ? STAFF[a.completedBy].name : a.completedBy), a.attachments.map(f => esc(f)).join('<br>') || '—']))));
  if(has('tbl-permits')) secs.push(sec('Permit inventory', reportTable(['Permit','Program','Site','Expires','Renewal app due'],
    d.permits.map(p => [`<b>${esc(p.number)}</b><br><span style="color:#737B6E">${esc(p.type)}</span>`, p.program, esc(siteOf(p).name), fmt(p.expires), p.renewalDue ? fmt(p.renewalDue) : '—']))));
  if(has('tbl-deviations')) secs.push(sec('Noncompliance events', scopedDevs.length ? reportTable(['Date','Event','Where','Cause → corrective action','Reported','Status'],
    scopedDevs.sort((a,b) => pd(b.date) - pd(a.date)).map(x => [fmt(x.date), `<b>${esc(x.type)}</b><br><span style="color:#737B6E">${esc(x.description)}</span>`, x.permitId && PERMITS[x.permitId] ? esc(PERMITS[x.permitId].number) : (devSite(x) ? esc(devSite(x).name) + ' <span style="color:#737B6E">(site event)</span>' : '—'), esc(x.cause) + ' <b>→</b> ' + esc(x.corrective), esc(x.reported), esc(x.status.replace('-',' '))])) : '<p style="font-size:12px;color:#3A7D34;margin-top:8px">No noncompliance events in this period — nothing to report.</p>'));
  if(has('tbl-waste')) secs.push(sec('Manifest log', d.mans.length ? reportTable(['Manifest','Shipped','Qty','TSDF','Status'],
    d.mans.slice(0, 12).map(m => [esc(m.manifestNo), fmt(m.shipDate), m.qty + ' ' + esc(m.units), esc(m.tsdf), esc(m.status)])) : '<p style="font-size:12px;color:#737B6E;margin-top:8px">No shipments in scope.</p>'));
  return `<div class="report-page" id="reportpage">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #2F5F4A;padding-bottom:14px">
      <div><span style="font-family:Spectral,Georgia,serif;font-size:1.5rem"><span style="color:#1B382D;font-weight:500">verd</span><span style="color:#418D80;font-style:italic">acta</span></span>
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#737B6E;margin-top:2px">${esc(acct().name)}</div></div>
      <div style="text-align:right;font-size:11px;color:#4E564E">Compliance report · <b>${esc(R.period)}</b><br>Generated ${fmt(D.today)} by ${esc(me().name)}</div>
    </div>
    <h2 style="font-family:Spectral,Georgia,serif;font-weight:300;font-size:1.9rem;margin:18px 0 2px;color:#1B382D">${esc(scopeName())}</h2>
    <div style="font-size:12px;color:#737B6E;margin-bottom:20px">${scopeSiteIds().length} site${scopeSiteIds().length === 1 ? '' : 's'} in scope · every figure traces to the register and its evidence files</div>
    ${tiles.length ? `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">${tiles.join('')}</div>` : ''}
    ${secs.join('')}
    <div style="margin-top:28px;border-top:1px solid #E4E7DB;padding-top:10px;font-size:9.5px;color:#A9AFA0">Prepared with Verdacta — every obligation, on the record. This summary reflects register status as of ${fmt(D.today)} and is not a legal compliance determination.</div>
  </div>`;
}
function genReport(){
  setCrumb(`<b>${esc(acct().name)}</b> · Report · ${esc(scopeName())}`);
  $('#view').innerHTML = `
    <div class="report-toolbar" style="display:flex;gap:8px;max-width:900px;margin:0 auto var(--s-5);align-items:center">
      <button class="btn btn-ghost" onclick="viewReports()">‹ Back to builder</button>
      <span style="flex:1"></span>
      <button class="btn btn-ghost" onclick="downloadReport()">⤓ Download</button>
      <button class="btn btn-ghost" onclick="window.print()">⎙ Print / Save PDF</button>
      <button class="btn btn-primary" onclick="openSendReport()">Send…</button>
    </div>
    ${reportHTML()}`;
  window.scrollTo(0, 0);
}
function downloadReport(){
  const html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Verdacta report — ' + scopeName() + '</title>' +
    '<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;500&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">' +
    '<style>body{font-family:"Public Sans",system-ui,sans-serif;background:#F2F3EC;padding:32px;color:#161F1A}.report-page{background:#FBFBF7;border:1px solid #E0E3D6;border-radius:18px;padding:40px;max-width:900px;margin:0 auto}@media print{body{background:#fff;padding:0}.report-page{border:none}}</style></head><body>' +
    reportHTML() + '</body></html>';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], {type: 'text/html'}));
  a.download = 'verdacta-report-' + scopeName().toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.html';
  a.click();
  toast('✓ Report downloaded — open in a browser or print to PDF');
}
function openSendReport(){
  const [kind, id] = R.scope.split('|');
  let recips = [];
  if(acct().kind === 'consulting'){
    const cids = kind === 'client' ? [id] : [...new Set(scopeSiteIds().map(sid => SITES[sid].clientId))];
    cids.forEach(cid => (CLIENTS[cid] ? CLIENTS[cid].contacts : []).forEach(ct => recips.push(ct.name + ' — ' + ct.email)));
  }
  D.firm.staff.forEach(st => recips.push(st.name + ' — ' + st.id + '@' + (acct().kind === 'consulting' ? 'magnoliaenv' : 'ergon') + '-demo.com'));
  openModal(`
    <h3>Send report — ${esc(scopeName())}</h3>
    <div class="form-row"><label>Recipients</label>
      <div style="max-height:180px;overflow-y:auto;border:1.5px solid var(--sagegray);border-radius:var(--r-md);padding:8px 12px">${recips.map((r, i) => `<label class="kpi-check"><input type="checkbox" ${i < 2 ? 'checked' : ''}>${esc(r)}</label>`).join('')}</div></div>
    <div class="form-row"><label>Message</label><textarea rows="3">Attached is the ${R.period} compliance summary for ${scopeName()}. Reach out with any questions.</textarea></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:var(--s-4)">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="closeModal();toast('✓ Report sent (prototype: production emails a PDF via Resend and logs it to Activity)')">Send report</button>
    </div>`);
}

/* ═══════════ search ═══════════ */
const sb = $('#searchbox'), sr = $('#searchresults');
sb.addEventListener('input', () => {
  const q = sb.value.trim().toLowerCase();
  if(q.length < 2){ sr.style.display = 'none'; return; }
  const hits = [];
  if(acct().kind === 'consulting') activeClients().forEach(c => { if(c.name.toLowerCase().includes(q)) hits.push({k:'Client', t:c.name, h:'#/client/'+c.id}); });
  else acctGroups().forEach(g => { if(g.name.toLowerCase().includes(q)) hits.push({k:acct().groupLabel.replace(/s$/,''), t:g.name, h:'#/group/'+g.id}); });
  visSites().forEach(s => { if(s.name.toLowerCase().includes(q)) hits.push({k:'Site', t:s.name, h:'#/site/'+s.id}); });
  acctPermits().forEach(p => { if((p.number+' '+p.type).toLowerCase().includes(q)) hits.push({k:'Permit', t:p.number+' — '+p.type, h:'#/permit/'+p.id}); });
  acctObs().forEach(o => { if(o.title.toLowerCase().includes(q)) hits.push({k:'Obligation', t:o.title, h:obLink(o)}); });
  sr.innerHTML = hits.slice(0,9).map(x => `<a href="${x.h}"><span class="k">${x.k}</span><br>${esc(x.t)}</a>`).join('') || '<a><span class="k">No results</span></a>';
  sr.style.display = 'block';
});
document.addEventListener('click', e => { if(!e.target.closest('.search')) sr.style.display = 'none'; });
sr.addEventListener('click', () => { sr.style.display = 'none'; sb.value = ''; });

/* ═══════════ BROWSER PERSISTENCE + DATA MODES (no database — session survives refresh) ═══════════ */
const SNAP_V = 12;
const DEMO_MODE = 'clean';
function stateKey(){ return 'verdacta-ergon-refining-state-v' + SNAP_V; }
function applyCleanMode(){
  ['documents','archivedCompletions','activity','notifications','wasteManifests','wasteActivity','wasteProfiles','planInspections','plans','projects','deviations','audits','calcWorkspace','permits','obligations','emissions'].forEach(k => { D[k].length = 0; });
  D.metrics.exceedancesYTD = 0;
  rebuildIdx();
}
let RESETTING = false; // once a reset starts, nothing may write the snapshot back before the reload
function saveState(){
  if(RESETTING) return;
  try{ localStorage.setItem(stateKey(), JSON.stringify({ v: SNAP_V, savedOn: D.today,
    obligations: D.obligations, documents: D.documents, archivedCompletions: D.archivedCompletions, activity: D.activity,
    notifications: D.notifications, wasteProfiles: D.wasteProfiles, wasteManifests: D.wasteManifests, wasteActivity: D.wasteActivity,
    planInspections: D.planInspections, plans: D.plans, projects: D.projects, deviations: D.deviations, audits: D.audits, calcWorkspace: D.calcWorkspace, permits: D.permits, emissions: D.emissions,
    clients: D.clients, sites: D.sites, staff: D.firm.staff,
    metrics: D.metrics, prefs: PREFS, s: { role: S.role, account: S.account, adhocN: S.adhocN } })); }catch(e){}
}
function restoreState(){
  const raw = localStorage.getItem(stateKey()); if(!raw) return;
  try{ const st = JSON.parse(raw); if(st.v !== SNAP_V) return;
    ['obligations','documents','archivedCompletions','activity','notifications','wasteProfiles','wasteManifests','wasteActivity','planInspections','plans','projects','deviations','audits','calcWorkspace','permits','emissions','clients','sites'].forEach(k => { if(st[k]) D[k] = st[k]; });
    if(st.staff) D.firm.staff = st.staff;
    if(st.metrics) D.metrics = st.metrics;
    if(st.prefs) Object.keys(st.prefs).forEach(k => PREFS[k] = st.prefs[k]);
    if(st.s){ S.role = st.s.role; S.account = st.s.account; S.adhocN = st.s.adhocN || 0; }
    D.firm.staff.forEach(sm => { if(!PREFS[sm.id]) PREFS[sm.id] = defaultPrefs(sm); });
    /* real-document demo: restored data keeps its true dates — statuses recompute against today instead */
    D.obligations.forEach(o => { if(!o.done && o.status !== 'review') o.status = o.nextDue ? statusFor(o.nextDue) : 'compliant'; });
    rebuildIdx();
  }catch(e){}
}
function setDemoMode(m){ localStorage.setItem('verdacta-mode', m); location.reload(); }
function resetDemo(){ RESETTING = true; localStorage.removeItem(stateKey()); toast('Demo data reset — reloading'); setTimeout(() => location.reload(), 400); }
if(DEMO_MODE === 'clean') applyCleanMode();
restoreState();
applyAirPortals();
const _toast = toast;
toast = function(msg){ _toast(msg); saveState(); };

if(!STAFF[S.role]) S.role = D.firm.staff[0].id;
const rs = $('#roleselect');
function refreshRoleSelect(){
  rs.innerHTML = D.firm.staff.map(st => `<option value="${st.id}">Viewing as: ${esc(st.name)} — ${esc(st.role)}</option>`).join('');
  rs.value = S.role;
}
refreshRoleSelect();
rs.addEventListener('change', () => { S.role = rs.value; toast(scoped() ? 'Scoped view: ' + me().name + ' sees only assigned sites and tasks' : 'Full portfolio view'); route(); });
$('#todaychip').textContent = 'Today · ' + fmt(D.today);
route();
</script>
