<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Verdacta · Magnolia Environmental Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;0,300;0,400;0,500;0,600;1,300;1,400&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══ @verdacta/ui tokens ═══ */
:root{
--pine-100:#E6EEE9;--pine-200:#C5D8CD;--pine-300:#9BBBA8;--pine-400:#6E9A82;--pine-500:#4A7D64;
--pine-600:#2F5F4A;--pine-700:#24493A;--pine-800:#1B382D;--pine-900:#12261F;
--verdigris-100:#E3F0ED;--verdigris-200:#C0DED8;--verdigris-300:#92C4BB;--verdigris-400:#64A89B;
--verdigris-500:#418D80;--verdigris-600:#327264;--verdigris-700:#285A50;--verdigris-800:#1F463E;--verdigris-900:#15302B;
--copper-200:#E9CDB7;--copper-300:#D7AB88;--copper-400:#C1885C;--copper-500:#A9683C;--copper-600:#8A5430;--copper-700:#6D4226;
--bone:#FBFBF7;--limestone:#F2F3EC;--ash:#E4E7DB;--sagegray:#D3D7C8;--lichen:#A9AFA0;
--fieldgray:#737B6E;--slategreen:#4E564E;--ink:#161F1A;--white:#FFF;
--st-compliant:#3A7D34;--st-compliant-bg:#E3EFDA;--st-compliant-tx:#2C5E27;
--st-due:#B87A1C;--st-due-bg:#F7ECD2;--st-due-tx:#7A5210;
--st-overdue:#B03A26;--st-overdue-bg:#F9E5DF;--st-overdue-tx:#8C2F1E;
--st-review:#3D74B8;--st-review-bg:#E1EBF6;--st-review-tx:#2C567F;
--st-superseded:#6E7468;--st-superseded-bg:#E9EBE2;--st-superseded-tx:#565C52;
--chart-1:#1D7043;--chart-2:#C07A33;--chart-3:#3D74B8;--chart-4:#9E4E86;
--font-display:'Spectral','Georgia',serif;--font-body:'Public Sans',system-ui,sans-serif;--font-mono:'Spline Sans Mono','Menlo',monospace;
--fs-micro:.6875rem;--fs-caption:.8125rem;--fs-sm:.875rem;--fs-base:1rem;--fs-lg:1.125rem;--fs-xl:1.375rem;--fs-2xl:1.75rem;--fs-3xl:2.25rem;--fs-4xl:2.75rem;
--s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-8:32px;--s-10:40px;--s-12:48px;--s-16:64px;
--r-sm:2px;--r-md:4px;--r-lg:8px;--r-xl:12px;
--shadow-sm:0 1px 2px rgba(18,38,31,.06);--shadow-md:0 4px 12px rgba(18,38,31,.08),0 1px 3px rgba(18,38,31,.05);
--ease:cubic-bezier(.22,1,.36,1);--dur:160ms;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-body);font-size:var(--fs-sm);line-height:1.55;color:var(--ink);background:var(--limestone);-webkit-font-smoothing:antialiased}
a{color:var(--verdigris-700);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:300;color:var(--pine-800);margin:0;line-height:1.15}
button{font-family:var(--font-body)}
::selection{background:var(--verdigris-200);color:var(--pine-900)}

/* ═══ Shell ═══ */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{background:var(--pine-800);color:var(--sagegray);padding:var(--s-5) 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.rail::-webkit-scrollbar{width:0}
.wm{font-family:var(--font-display);line-height:1;white-space:nowrap}
.wm .verd{color:var(--bone);font-weight:500}
.wm .acta{color:var(--verdigris-300);font-style:italic;font-weight:300}
.rail-logo{padding:0 var(--s-5) var(--s-4);font-size:var(--fs-xl);border-bottom:1px solid rgba(251,251,247,.1);margin-bottom:var(--s-4)}
.rail-firm{padding:0 var(--s-5);font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.13em;color:var(--pine-300);margin:var(--s-2) 0 var(--s-2)}
.rail a.nav{display:flex;align-items:center;gap:10px;padding:8px var(--s-5);color:var(--sagegray);font-size:var(--fs-sm);border-left:3px solid transparent;transition:all var(--dur) var(--ease)}
.rail a.nav:hover{background:rgba(251,251,247,.06);text-decoration:none;color:var(--bone)}
.rail a.nav.active{background:rgba(65,141,128,.24);color:var(--bone);border-left-color:var(--verdigris-400);font-weight:600}
.rail a.nav .ic{width:16px;height:16px;flex:none;opacity:.75}
.rail a.nav .badge{margin-left:auto;background:var(--st-overdue);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 7px}
.rail a.nav .badge.amber{background:var(--st-due)}
.rail-bottom{margin-top:auto;padding:var(--s-4) var(--s-5) 0;border-top:1px solid rgba(251,251,247,.1)}
.rail-user{display:flex;gap:10px;align-items:center;font-size:var(--fs-caption);color:var(--pine-200)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--verdigris-600);color:var(--bone);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.avatar.sm{width:24px;height:24px;font-size:9px}
.avatar.copper{background:var(--copper-500)}.avatar.plum{background:#9E4E86}.avatar.river{background:#3D74B8}.avatar.pine{background:var(--pine-500)}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--bone);border-bottom:1px solid var(--sagegray);padding:var(--s-3) var(--s-8);display:flex;align-items:center;gap:var(--s-5);position:sticky;top:0;z-index:40}
.crumb{font-size:var(--fs-caption);color:var(--fieldgray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--pine-800);font-weight:600}
.search{margin-left:auto;position:relative}
.search input{width:290px;font-family:var(--font-body);font-size:var(--fs-caption);padding:7px 12px 7px 30px;border:1.5px solid var(--sagegray);border-radius:var(--r-md);background:var(--white);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--verdigris-600);box-shadow:0 0 0 3px rgba(65,141,128,.22)}
.search .mag{position:absolute;left:9px;top:7px;color:var(--lichen)}
.search-results{position:absolute;top:36px;right:0;width:360px;background:var(--bone);border:1px solid var(--sagegray);border-radius:var(--r-lg);box-shadow:var(--shadow-md);z-index:60;max-height:340px;overflow-y:auto;display:none}
.search-results a{display:block;padding:9px 14px;border-bottom:1px solid var(--ash);font-size:var(--fs-caption);color:var(--ink)}
.search-results a:hover{background:var(--limestone);text-decoration:none}
.search-results .k{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.08em;color:var(--fieldgray)}
.today-chip{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--fieldgray);background:var(--ash);padding:4px 10px;border-radius:var(--r-md);white-space:nowrap}
.view{padding:var(--s-8);max-width:1360px;width:100%;margin:0 auto}

/* ═══ Primitives ═══ */
.card{background:var(--bone);border:1px solid var(--sagegray);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card-pad{padding:var(--s-5)}
.section-label{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.14em;color:var(--verdigris-700);font-weight:700;margin-bottom:var(--s-3);display:flex;align-items:center;gap:8px}
.section-label::after{content:"";flex:1;height:1px;background:var(--ash)}
.grid{display:grid;gap:var(--s-4)}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--s-3);margin-bottom:var(--s-6)}
.kpi{background:var(--bone);border:1px solid var(--sagegray);border-radius:var(--r-lg);padding:var(--s-4)}
.kpi .lbl{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.12em;color:var(--fieldgray);margin-bottom:2px;white-space:nowrap}
.kpi .num{font-family:var(--font-display);font-size:var(--fs-3xl);font-weight:300;color:var(--pine-700);line-height:1.05}
.kpi .num.red{color:var(--st-overdue)}.kpi .num.amber{color:var(--st-due-tx)}
.kpi .sub{font-size:var(--fs-micro);color:var(--fieldgray)}
.kpi.alert{border-color:var(--st-overdue);background:var(--st-overdue-bg)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-micro);font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.chip .ic{width:6px;height:6px;border-radius:50%;flex:none}
.chip.compliant{background:var(--st-compliant-bg);color:var(--st-compliant-tx)}.chip.compliant .ic{background:var(--st-compliant)}
.chip.due{background:var(--st-due-bg);color:var(--st-due-tx)}.chip.due .ic{background:var(--st-due);border-radius:1px}
.chip.overdue{background:var(--st-overdue-bg);color:var(--st-overdue-tx)}.chip.overdue .ic{background:var(--st-overdue);border-radius:1px;transform:rotate(45deg)}
.chip.review{background:var(--st-review-bg);color:var(--st-review-tx)}.chip.review .ic{background:var(--st-review)}
.chip.superseded{background:var(--st-superseded-bg);color:var(--st-superseded-tx)}.chip.superseded .ic{background:var(--st-superseded)}
.ptag{display:inline-flex;font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.1em;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.ptag.air{background:var(--pine-100);color:var(--pine-700)}
.ptag.water{background:var(--st-review-bg);color:var(--st-review-tx)}
.ptag.stormwater{background:var(--verdigris-100);color:var(--verdigris-800)}
.ptag.pretreatment{background:#F3E7EF;color:#7A3D68}
.cite{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;font-weight:500;color:var(--verdigris-800);background:var(--verdigris-100);border:1px solid var(--verdigris-200);border-radius:var(--r-sm);padding:1px 7px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cite.wrap{white-space:normal;max-width:100%;line-height:1.5}
.cite::before{content:"§";color:var(--copper-600);font-family:var(--font-display)}
.mono{font-family:var(--font-mono);font-size:var(--fs-caption)}
.btn{font-size:var(--fs-caption);font-weight:600;padding:8px 16px;border-radius:var(--r-md);border:1.5px solid transparent;cursor:pointer;transition:all var(--dur) var(--ease)}
.btn-primary{background:var(--pine-600);color:var(--bone)}.btn-primary:hover{background:var(--pine-800)}
.btn-ghost{background:transparent;border-color:var(--pine-400);color:var(--pine-700)}.btn-ghost:hover{background:var(--ash)}
.btn:focus-visible{outline:3px solid var(--verdigris-400);outline-offset:2px}
table.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-caption)}
.tbl th{text-align:left;padding:8px 12px;font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.09em;color:var(--slategreen);background:var(--ash);white-space:nowrap;position:sticky;top:0}
.tbl td{padding:10px 12px;border-top:1px solid var(--ash);vertical-align:middle}
.tbl tr.row-link{cursor:pointer}
.tbl tr.row-link:hover{background:var(--limestone)}
.tbl tr.ovd{background:var(--st-overdue-bg)}
.duecell{font-family:var(--font-mono);font-size:var(--fs-micro);white-space:nowrap}
.duecell .rel{display:block;font-family:var(--font-body);font-weight:600;font-size:var(--fs-micro);color:var(--fieldgray)}
.duecell .rel.red{color:var(--st-overdue)}.duecell .rel.amber{color:var(--st-due-tx)}
.empty{border:1px dashed var(--sagegray);border-radius:var(--r-lg);padding:var(--s-8);text-align:center;color:var(--fieldgray);font-size:var(--fs-caption)}
.empty .glyph{font-family:var(--font-display);font-size:var(--fs-2xl);color:var(--lichen)}
.progress{height:7px;background:var(--ash);border-radius:99px;overflow:hidden}
.progress > div{height:100%;background:linear-gradient(90deg,var(--verdigris-500),var(--verdigris-600));border-radius:99px}
.runway{height:10px;background:var(--ash);border-radius:99px;overflow:hidden;position:relative}
.runway > div{height:100%;border-radius:99px}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--ash);margin:var(--s-5) 0 var(--s-5)}
.tabs button{background:none;border:none;padding:9px 16px;font-size:var(--fs-sm);font-weight:600;color:var(--fieldgray);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs button.active{color:var(--pine-800);border-bottom-color:var(--verdigris-500)}
.tabs button:hover{color:var(--pine-700)}
.tabs button .ct{font-size:10px;background:var(--ash);border-radius:99px;padding:1px 6px;margin-left:5px;color:var(--slategreen)}

/* timeline */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--ash)}
.timeline li{position:relative;padding:0 0 var(--s-5) var(--s-8)}
.timeline .dot{position:absolute;left:4px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--bone);border:2px solid var(--verdigris-500);display:flex;align-items:center;justify-content:center}
.timeline li.k-rejection .dot,.timeline li.k-agency-action.neg .dot{border-color:var(--st-overdue)}
.timeline li.k-submission .dot{border-color:var(--pine-500);background:var(--pine-500)}
.timeline li.k-agency-action .dot{border-color:var(--st-review)}
.timeline li.k-reminder .dot{border-color:var(--st-due)}
.timeline .t-date{font-family:var(--font-mono);font-size:var(--fs-micro);color:var(--fieldgray)}
.timeline .t-text{font-size:var(--fs-caption);color:var(--ink);margin:1px 0 2px}
.timeline .t-by{font-size:var(--fs-micro);color:var(--fieldgray)}
.kind-tag{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:1px 7px;border-radius:99px;margin-right:6px;background:var(--ash);color:var(--slategreen)}
.kind-tag.submission{background:var(--pine-100);color:var(--pine-700)}
.kind-tag.rejection{background:var(--st-overdue-bg);color:var(--st-overdue-tx)}
.kind-tag.agency-action{background:var(--st-review-bg);color:var(--st-review-tx)}
.kind-tag.reminder{background:var(--st-due-bg);color:var(--st-due-tx)}
.kind-tag.call{background:#F3E7EF;color:#7A3D68}

/* documents */
.doc-row{display:flex;align-items:center;gap:var(--s-4);padding:11px 14px;border-top:1px solid var(--ash)}
.doc-row:first-child{border-top:0}
.doc-row:hover{background:var(--limestone)}
.doc-ic{width:34px;height:40px;border:1.5px solid var(--sagegray);border-radius:3px;background:var(--white);position:relative;flex:none;display:flex;align-items:flex-end;justify-content:center;font-size:8px;font-weight:700;color:var(--fieldgray);padding-bottom:3px}
.doc-ic::before{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 10px 10px 0;border-color:var(--limestone) var(--limestone) var(--sagegray) var(--sagegray)}
.doc-name{font-weight:600;font-size:var(--fs-caption);color:var(--ink)}
.doc-meta{font-size:var(--fs-micro);color:var(--fieldgray)}
.doc-status{margin-left:auto;flex:none}
.dstat{display:inline-flex;font-size:var(--fs-micro);font-weight:700;padding:2px 9px;border-radius:var(--r-sm);white-space:nowrap}
.dstat.accepted{background:var(--st-compliant-bg);color:var(--st-compliant-tx)}
.dstat.submitted,.dstat.resubmitted{background:var(--st-review-bg);color:var(--st-review-tx)}
.dstat.rejected,.dstat.revision-requested{background:var(--st-overdue-bg);color:var(--st-overdue-tx)}
.dstat.draft{background:var(--ash);color:var(--slategreen)}
.dstat.received{background:var(--verdigris-100);color:var(--verdigris-800)}

/* calendar */
.cal-head{display:flex;align-items:center;gap:var(--s-4);margin-bottom:var(--s-4)}
.cal-title{font-family:var(--font-display);font-size:var(--fs-2xl);font-weight:300}
.cal-nav{display:flex;gap:6px;margin-left:auto}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-dow{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.1em;color:var(--fieldgray);text-align:center;padding:4px 0;font-weight:700}
.cal-cell{min-width:0;background:var(--bone);border:1px solid var(--sagegray);border-radius:var(--r-md);min-height:96px;padding:6px;font-size:var(--fs-micro)}
.cal-cell.dim{background:var(--limestone);opacity:.55}
.cal-cell.today{border:1.5px solid var(--verdigris-500);box-shadow:0 0 0 3px rgba(65,141,128,.15)}
.cal-date{font-family:var(--font-mono);color:var(--fieldgray);margin-bottom:3px}
.cal-cell.today .cal-date{color:var(--verdigris-700);font-weight:700}
.pill{display:block;border-radius:var(--r-sm);font-size:10px;font-weight:600;padding:2px 6px;margin-bottom:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid}
.pill.due{background:var(--st-due-bg);color:var(--st-due-tx);border-color:var(--st-due)}
.pill.overdue{background:var(--st-overdue-bg);color:var(--st-overdue-tx);border-color:var(--st-overdue)}
.pill.compliant{background:var(--verdigris-100);color:var(--verdigris-800);border-color:var(--verdigris-500)}
.pill.review{background:var(--st-review-bg);color:var(--st-review-tx);border-color:var(--st-review)}
.pill.project{background:var(--pine-100);color:var(--pine-700);border-color:var(--pine-500)}

/* notifications */
.notif-row{display:flex;gap:var(--s-4);padding:12px 14px;border-top:1px solid var(--ash);align-items:flex-start}
.notif-row:first-child{border-top:0}
.lvl{flex:none;font-family:var(--font-mono);font-size:var(--fs-micro);font-weight:700;padding:3px 8px;border-radius:var(--r-sm);margin-top:1px}
.lvl.warn{background:var(--st-due-bg);color:var(--st-due-tx)}
.lvl.crit{background:var(--st-overdue-bg);color:var(--st-overdue-tx)}
.lvl.info{background:var(--st-review-bg);color:var(--st-review-tx)}
.chan{display:inline-flex;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--sagegray);border-radius:99px;padding:1px 7px;color:var(--slategreen);margin-left:4px}
.ladder{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rung{font-family:var(--font-mono);font-size:var(--fs-micro);font-weight:600;background:var(--verdigris-100);color:var(--verdigris-800);border:1px solid var(--verdigris-200);border-radius:99px;padding:2px 9px}
.rung.sms{background:var(--st-due-bg);color:var(--st-due-tx);border-color:var(--st-due)}
.toggle{display:inline-block;width:32px;height:18px;background:var(--verdigris-500);border-radius:99px;position:relative;vertical-align:middle}
.toggle::after{content:"";position:absolute;right:2px;top:2px;width:14px;height:14px;background:#fff;border-radius:50%}
.toggle.off{background:var(--sagegray)}
.toggle.off::after{right:auto;left:2px}

/* misc */
.two-col{display:grid;grid-template-columns:2fr 1fr;gap:var(--s-5);align-items:start}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s-4)}
.hero-strip{background:var(--pine-800);border-radius:var(--r-lg);color:var(--sagegray);padding:var(--s-5) var(--s-6);display:flex;align-items:center;gap:var(--s-6);margin-bottom:var(--s-6);flex-wrap:wrap}
.hero-strip h2{color:var(--bone);font-size:var(--fs-2xl)}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:var(--s-4);align-items:center}
.filterbar select,.filterbar input{font-family:var(--font-body);font-size:var(--fs-caption);padding:7px 10px;border:1.5px solid var(--sagegray);border-radius:var(--r-md);background:var(--white);color:var(--ink)}
.filterbar select:focus,.filterbar input:focus{outline:none;border-color:var(--verdigris-600)}
.bar-row{display:grid;grid-template-columns:110px 1fr 30px;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .blbl{font-size:var(--fs-caption);color:var(--slategreen)}
.bar-row .btrack{height:13px;background:var(--ash);border-radius:0 4px 4px 0}
.bar-row .bfill{height:100%;background:var(--chart-1);border-radius:0 4px 4px 0}
.bar-row .bval{font-family:var(--font-mono);font-size:var(--fs-caption);text-align:right;color:var(--ink)}
.breadcrumbs{font-size:var(--fs-caption);color:var(--fieldgray);margin-bottom:var(--s-4)}
.breadcrumbs a{color:var(--verdigris-700)}
.pagehead{display:flex;align-items:flex-start;gap:var(--s-5);margin-bottom:var(--s-6);flex-wrap:wrap}

<script>
/* ═══════════ helpers ═══════════ */
const D = window.VERDACTA_DATA;
const TODAY = new Date(D.today + 'T12:00:00');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const idx = (arr) => Object.fromEntries(arr.map(x => [x.id, x]));
const CLIENTS = idx(D.clients), SITES = idx(D.sites), PERMITS = idx(D.permits), STAFF = idx(D.firm.staff), OBS = idx(D.obligations);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const AV_COLORS = ['copper','pine','river','plum',''];
const avColor = sid => AV_COLORS[Math.max(0, D.firm.staff.findIndex(s=>s.id===sid)) % AV_COLORS.length];
function pd(s){ const [y,m,dd] = s.split('-').map(Number); return new Date(y, m-1, dd, 12); }
function fmt(s){ if(!s) return '—'; const d = pd(s); return MON[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }
function fmtShort(s){ const d = pd(s); return MON[d.getMonth()] + ' ' + d.getDate(); }
function days(s){ return Math.round((pd(s) - TODAY) / 86400000); }
function rel(s){
  if(!s) return '';
  const n = days(s);
  if(n === 0) return 'today';
  if(n === 1) return 'tomorrow';
  if(n < 0) return (-n) + (n === -1 ? ' day' : ' days') + ' overdue';
  return 'in ' + n + ' days';
}
function relClass(s){ if(!s) return ''; const n = days(s); return n < 0 ? 'red' : (n <= 45 ? 'amber' : ''); }
function siteOf(p){ return SITES[p.siteId]; }
function clientOf(p){ return CLIENTS[siteOf(p).clientId]; }
function permitObs(pid){ return D.obligations.filter(o => o.permitId === pid); }
function chip(status, label){
  const lbl = label || {compliant:'Compliant', due:'Due', overdue:'Overdue', review:'In review', superseded:'Superseded'}[status];
  return `<span class="chip ${status}"><span class="ic"></span>${esc(lbl)}</span>`;
}
function obChip(o){
  if(o.status === 'due' && o.nextDue) return chip('due', 'Due ' + rel(o.nextDue).replace('in ','in '));
  if(o.status === 'overdue' && o.nextDue) return chip('overdue', 'Overdue · ' + (-days(o.nextDue)) + 'd');
  return chip(o.status);
}
function ptag(prog){ const lbl = {air:'Air', water:'NPDES', stormwater:'Stormwater', pretreatment:'Pretreat'}[prog] || prog; return `<span class="ptag ${prog}">${lbl}</span>`; }
function cite(c, wrap){ return c ? `<span class="cite ${wrap?'wrap':''}" title="${esc(c)}">${esc(c)}</span>` : ''; }
function av(sid){ const s = STAFF[sid]; return s ? `<span class="avatar sm ${avColor(sid)}" title="${esc(s.name)} · ${esc(s.role)}">${esc(s.initials)}</span>` : ''; }
function duecell(s){ if(!s) return '<span class="mono" style="color:var(--lichen)">—</span>'; return `<div class="duecell">${fmt(s)}<span class="rel ${relClass(s)}">${rel(s)}</span></div>`; }
function urgency(o){ if(!o.nextDue) return 99999; const n = days(o.nextDue); return o.status === 'overdue' ? n - 10000 : n; }
function go(h){ location.hash = h; }
function permitPath(p){ const s = siteOf(p), c = clientOf(p); return `${esc(c.name)} · ${esc(s.name)}`; }

/* derived stats */
const stats = {
  due30: D.obligations.filter(o => o.nextDue && days(o.nextDue) >= 0 && days(o.nextDue) <= 30).length,
  due60: D.obligations.filter(o => o.nextDue && days(o.nextDue) >= 0 && days(o.nextDue) <= 60).length,
  overdue: D.obligations.filter(o => o.status === 'overdue').length,
  review: D.obligations.filter(o => o.status === 'review').length,
  openProjects: D.projects.filter(p => p.status !== 'complete').length,
  awaitingAgency: D.documents.filter(d => d.status === 'submitted' || d.status === 'resubmitted').length
};

/* ═══════════ rail + topbar ═══════════ */
function renderRail(route){
  const navIc = {dash:'▦', cal:'▤', reg:'☰', bell:'◷', proj:'◳'};
  const clientLinks = D.clients.map(c => {
    const sites = D.sites.filter(s => s.clientId === c.id).map(s => s.id);
    const obs = D.obligations.filter(o => { const p = PERMITS[o.permitId]; return sites.includes(p.siteId); });
    const ovd = obs.filter(o => o.status === 'overdue').length;
    const due = obs.filter(o => o.status === 'due').length;
    const badge = ovd ? `<span class="badge">${ovd}</span>` : (due ? `<span class="badge amber">${due}</span>` : '');
    return `<a class="nav ${route === '#/client/' + c.id ? 'active' : ''}" href="#/client/${c.id}"><span class="ic">◈</span>${esc(c.name.replace(', Inc.','').replace(', LLC',''))}${badge}</a>`;
  }).join('');
  $('#rail').innerHTML = `
    <div class="rail-logo"><span class="wm"><span class="verd">verd</span><span class="acta">acta</span></span></div>
    <div class="rail-firm">${esc(D.firm.name)}</div>
    <a class="nav ${route === '#/' || route === '' ? 'active' : ''}" href="#/"><span class="ic">${navIc.dash}</span>Dashboard</a>
    <a class="nav ${route === '#/calendar' ? 'active' : ''}" href="#/calendar"><span class="ic">${navIc.cal}</span>Calendar</a>
    <a class="nav ${route === '#/register' ? 'active' : ''}" href="#/register"><span class="ic">${navIc.reg}</span>Register</a>
    <a class="nav ${route === '#/notifications' ? 'active' : ''}" href="#/notifications"><span class="ic">${navIc.bell}</span>Notifications${stats.overdue ? `<span class="badge">${stats.overdue}</span>` : ''}</a>
    <div class="rail-firm" style="margin-top:var(--s-5)">Clients</div>
    ${clientLinks}
    <div class="rail-bottom">
      <div class="rail-user"><span class="avatar copper">KL</span><div>Katherine Laurent, PE<br><span style="color:var(--pine-300)">Principal</span></div></div>
    </div>`;
}
function setCrumb(html){ $('#crumb').innerHTML = html; }

/* ═══════════ router ═══════════ */
function route(){
  const h = location.hash || '#/';
  renderRail(h.split('?')[0]);
  window.scrollTo(0,0);
  if(h === '#/' || h === '') return viewFirm();
  if(h.startsWith('#/client/')) return viewClient(h.split('/')[2]);
  if(h.startsWith('#/site/')) return viewSite(h.split('/')[2]);
  if(h.startsWith('#/permit/')) return viewPermit(h.split('/')[2], h.split('/')[3] || 'obligations');
  if(h === '#/calendar') return viewCalendar();
  if(h === '#/register') return viewRegister();
  if(h === '#/notifications') return viewNotifications();
  viewFirm();
}
window.addEventListener('hashchange', route);

/* ═══════════ FIRM DASHBOARD ═══════════ */
function needsAttention(scopeObs, limit){
  const items = scopeObs.filter(o => o.status === 'overdue' || o.status === 'due').sort((a,b) => urgency(a) - urgency(b)).slice(0, limit);
  if(!items.length) return `<div class="empty"><div class="glyph">§</div>Nothing needs attention in this window.</div>`;
  return `<table class="tbl">${items.map(o => {
    const p = PERMITS[o.permitId];
    return `<tr class="row-link ${o.status === 'overdue' ? 'ovd' : ''}" onclick="go('#/permit/${p.id}/obligations')">
      <td style="width:52%"><b>${esc(o.title)}</b><br><span style="color:var(--fieldgray);font-size:var(--fs-micro)">${permitPath(p)} · <span class="mono">${esc(p.number)}</span></span></td>
      <td>${ptag(p.program)}</td>
      <td>${duecell(o.nextDue)}</td>
      <td>${av(o.assignee)}</td>
      <td style="text-align:right">${obChip(o)}</td>
    </tr>`;
  }).join('')}</table>`;
}
function renewalRunway(){
  const rows = D.permits.filter(p => p.expires).sort((a,b) => pd(a.expires) - pd(b.expires)).map(p => {
    const total = 5*365, remaining = Math.max(0, days(p.expires));
    const pct = Math.min(100, Math.max(2, Math.round(remaining/total*100)));
    const color = remaining < 240 ? 'var(--st-overdue)' : remaining < 540 ? 'var(--st-due)' : 'var(--verdigris-500)';
    const renewTxt = p.renewalDue ? (days(p.renewalDue) >= 0 ? `renewal app due ${fmtShort(p.renewalDue)} · ${rel(p.renewalDue)}` : `renewal app was due ${fmtShort(p.renewalDue)}`) : (p.status === 'admin-continued' ? 'administratively continued — watch for reissuance' : '');
    return `<div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;font-size:var(--fs-micro);margin-bottom:3px">
        <span><a href="#/permit/${p.id}"><b class="mono">${esc(p.number)}</b></a> <span style="color:var(--fieldgray)">${esc(clientOf(p).name.split(',')[0])}</span></span>
        <span class="mono" style="color:var(--fieldgray)">exp ${fmt(p.expires)}</span>
      </div>
      <div class="runway"><div style="width:${pct}%;background:${color}"></div></div>
      ${renewTxt ? `<div style="font-size:var(--fs-micro);color:${remaining<240 ? 'var(--st-overdue-tx)' : 'var(--fieldgray)'};margin-top:2px">${renewTxt}</div>` : ''}
    </div>`;
  }).join('');
  return rows;
}
function activityFeed(items, limit){
  const list = items.sort((a,b) => pd(b.date) - pd(a.date)).slice(0, limit);
  return `<ul class="timeline">${list.map(a => {
    const p = PERMITS[a.permitId];
    const who = STAFF[a.by] ? STAFF[a.by].name : a.by === 'MDEQ' ? 'MDEQ' : 'Verdacta';
    return `<li class="k-${a.kind}"><span class="dot"></span>
      <span class="t-date">${fmt(a.date)}</span>
      <div class="t-text"><span class="kind-tag ${a.kind}">${a.kind.replace('-',' ')}</span>${esc(a.text)}</div>
      <div class="t-by">${esc(who)} · <a href="#/permit/${p.id}/activity">${esc(p.number)}</a></div></li>`;
  }).join('')}</ul>`;
}
function programChart(scopeObs){
  const progs = ['air','water','stormwater','pretreatment'];
  const counts = progs.map(pr => scopeObs.filter(o => PERMITS[o.permitId].program === pr).length);
  const max = Math.max(...counts, 1);
  const lbl = {air:'Air', water:'NPDES', stormwater:'Stormwater', pretreatment:'Pretreatment'};
  return progs.map((pr,i) => counts[i] ? `<div class="bar-row"><span class="blbl">${lbl[pr]}</span><div class="btrack"><div class="bfill" style="width:${Math.round(counts[i]/max*100)}%"></div></div><span class="bval">${counts[i]}</span></div>` : '').join('');
}
function viewFirm(){
  setCrumb(`<b>${esc(D.firm.name)}</b> · Portfolio dashboard`);
  const flagship = D.permits.find(p => p.id.includes('ergon-tv')) || D.permits.find(p => p.status === 'expiring');
  const hero = flagship && flagship.renewalDue && days(flagship.renewalDue) >= 0 && days(flagship.renewalDue) <= 45 ? `
    <div class="hero-strip">
      <div style="flex:1;min-width:280px">
        <div style="font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.18em;color:var(--verdigris-300);font-weight:700;margin-bottom:4px">Priority filing</div>
        <h2>Title V renewal application — ${esc(clientOf(flagship).name.split(',')[0])}</h2>
        <div style="font-size:var(--fs-caption);color:var(--sagegray);margin-top:4px">Permit <span class="mono" style="color:var(--bone)">${esc(flagship.number)}</span> expires ${fmt(flagship.expires)}. MDEQ requires the renewal application at least 6 months prior.</div>
      </div>
      <div style="text-align:center">
        <div style="font-family:var(--font-display);font-size:var(--fs-4xl);font-weight:300;color:var(--st-due);line-height:1">${days(flagship.renewalDue)}</div>
        <div style="font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.14em;color:var(--sagegray)">days to file</div>
      </div>
      <button class="btn btn-primary" onclick="go('#/permit/${flagship.id}')" style="background:var(--verdigris-500)">Open permit</button>
    </div>` : '';
  const portfolio = D.clients.map(c => {
    const sites = D.sites.filter(s => s.clientId === c.id);
    return sites.map((s, i) => {
      const permits = D.permits.filter(p => p.siteId === s.id);
      return permits.map((p, j) => {
        const obs = permitObs(p.id);
        const ovd = obs.filter(o => o.status === 'overdue').length;
        const due = obs.filter(o => o.status === 'due').length;
        const next = obs.filter(o => o.nextDue && days(o.nextDue) >= 0).sort((a,b) => pd(a.nextDue) - pd(b.nextDue))[0];
        return `<tr class="row-link" onclick="go('#/permit/${p.id}')">
          <td>${i === 0 && j === 0 ? `<a href="#/client/${c.id}" onclick="event.stopPropagation()"><b>${esc(c.name)}</b></a>` : ''}</td>
          <td>${j === 0 ? `<a href="#/site/${s.id}" onclick="event.stopPropagation()">${esc(s.name)}</a>` : ''}</td>
          <td><span class="mono">${esc(p.number)}</span></td>
          <td>${ptag(p.program)}</td>
          <td class="mono" style="white-space:nowrap">${fmt(p.expires)}</td>
          <td>${next ? duecell(next.nextDue) : '—'}</td>
          <td style="text-align:right;white-space:nowrap">${ovd ? chip('overdue', ovd + ' overdue') + ' ' : ''}${due ? chip('due', due + ' due') : (!ovd ? chip('compliant', 'Current') : '')}</td>
        </tr>`;
      }).join('');
    }).join('');
  }).join('');
  $('#view').innerHTML = `
    <div class="pagehead"><div><h1>Portfolio dashboard</h1><div class="sub">${D.clients.length} clients · ${D.sites.length} sites · ${D.permits.length} permits · ${D.obligations.length} tracked obligations</div></div></div>
    ${hero}
    <div class="kpis">
      <div class="kpi ${stats.overdue ? 'alert' : ''}"><div class="lbl">Overdue</div><div class="num ${stats.overdue ? 'red' : ''}">${stats.overdue}</div><div class="sub">needs action now</div></div>
      <div class="kpi"><div class="lbl">Due ≤ 30 days</div><div class="num amber">${stats.due30}</div><div class="sub">${stats.due60} within 60</div></div>
      <div class="kpi"><div class="lbl">Active permits</div><div class="num">${D.permits.length}</div><div class="sub">${D.permits.filter(p=>p.status==='expiring').length} in renewal window</div></div>
      <div class="kpi"><div class="lbl">Open projects</div><div class="num">${stats.openProjects}</div><div class="sub">${D.projects.filter(p=>p.status==='active').length} active</div></div>
      <div class="kpi"><div class="lbl">Awaiting agency</div><div class="num">${stats.awaitingAgency}</div><div class="sub">submittals pending</div></div>
      <div class="kpi"><div class="lbl">In review</div><div class="num">${stats.review}</div><div class="sub">engineer sign-off</div></div>
    </div>
    <div class="two-col">
      <div>
        <div class="section-label">Needs attention · next 45 days</div>
        <div class="card">${needsAttention(D.obligations, 9)}</div>
        <div class="section-label" style="margin-top:var(--s-6)">Client portfolio</div>
        <div class="card" style="overflow-x:auto"><table class="tbl">
          <thead><tr><th>Client</th><th>Site</th><th>Permit</th><th>Program</th><th>Expires</th><th>Next deadline</th><th style="text-align:right">Status</th></tr></thead>
          <tbody>${portfolio}</tbody></table></div>
      </div>
      <div>
        <div class="section-label">Renewal runway</div>
        <div class="card card-pad">${renewalRunway()}</div>
        <div class="section-label" style="margin-top:var(--s-6)">Obligations by program</div>
        <div class="card card-pad">${programChart(D.obligations)}<div style="font-size:var(--fs-micro);color:var(--fieldgray);margin-top:6px">${D.obligations.length} active obligations across ${D.permits.length} permits</div></div>
        <div class="section-label" style="margin-top:var(--s-6)">Recent activity</div>
        <div class="card card-pad">${activityFeed(D.activity, 6)}</div>
      </div>
    </div>`;
}

/* ═══════════ CLIENT VIEW ═══════════ */
function viewClient(cid){
  const c = CLIENTS[cid]; if(!c) return viewFirm();
  const sites = D.sites.filter(s => s.clientId === cid);
  const permits = D.permits.filter(p => sites.some(s => s.id === p.siteId));
  const obs = D.obligations.filter(o => permits.some(p => p.id === o.permitId));
  const projects = D.projects.filter(pr => sites.some(s => s.id === pr.siteId));
  setCrumb(`<a href="#/">${esc(D.firm.name)}</a> › <b>${esc(c.name)}</b>`);
  const siteCards = sites.map(s => {
    const sp = D.permits.filter(p => p.siteId === s.id);
    return `<div class="card card-pad">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
        <h3 style="font-size:var(--fs-xl)"><a href="#/site/${s.id}">${esc(s.name)}</a></h3>
        <span style="font-size:var(--fs-micro);color:var(--fieldgray)">${esc(s.city)}, ${esc(s.county)} Co.</span>
      </div>
      <p style="font-size:var(--fs-caption);color:var(--slategreen);margin:6px 0 10px">${esc(s.description)}</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${sp.map(p => `<a href="#/permit/${p.id}" style="text-decoration:none">${ptag(p.program)}</a>`).join('')}<span style="font-size:var(--fs-micro);color:var(--fieldgray);align-self:center">${sp.length} permit${sp.length>1?'s':''}</span></div>
    </div>`;
  }).join('');
  const contacts = c.contacts.map(ct => `
    <div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--ash)">
      <span class="avatar sm pine">${esc(ct.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase())}</span>
      <div style="flex:1"><b style="font-size:var(--fs-caption)">${esc(ct.name)}</b><br><span style="font-size:var(--fs-micro);color:var(--fieldgray)">${esc(ct.title)}</span><br>
      <span class="mono" style="font-size:10px;color:var(--fieldgray)">${esc(ct.email)} · ${esc(ct.phone)}</span></div>
      <div style="text-align:right;font-size:9px;color:var(--fieldgray)">
        <span class="toggle ${ct.notify.email?'':'off'}"></span> email<br>
        <span class="toggle ${ct.notify.sms?'':'off'}" style="margin-top:3px"></span> SMS</div>
    </div>`).join('');
  const projRows = projects.length ? projects.map(pr => `
    <tr class="row-link" onclick="go('#/site/${pr.siteId}')">
      <td><b>${esc(pr.name)}</b><br><span style="font-size:var(--fs-micro);color:var(--fieldgray)">${esc(SITES[pr.siteId].name)}</span></td>
      <td><span class="kind-tag">${pr.type}</span></td>
      <td>${duecell(pr.due)}</td>
      <td style="width:130px"><div class="progress"><div style="width:${pr.pctComplete}%"></div></div><span style="font-size:var(--fs-micro);color:var(--fieldgray)">${pr.pctComplete}%</span></td>
      <td>${av(pr.lead)}</td>
    </tr>`).join('') : '';
  $('#view').innerHTML = `

      <div class="kpi"><div class="lbl">Permits</div><div class="num">${permits.length}</div></div>

/* ═══════════ SITE VIEW ═══════════ */

  const obs = D.obligations.filter(o => permits.some(p => p.id === o.permitId));
  const projects = D.projects.filter(pr => pr.siteId === sid);
  const docs = D.documents.filter(d => permits.some(p => p.id === d.permitId)).sort((a,b) => pd(b.date) - pd(a.date)).slice(0,5);
  setCrumb(`<a href="#/">${esc(D.firm.name)}</a> › <a href="#/client/${c.id}">${esc(c.name)}</a> › <b>${esc(s.name)}</b>`);
  const permitCards = permits.map(p => {

      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px">${ptag(p.program)}${ovd ? chip('overdue', ovd + ' overdue') : due ? chip('due', due + ' due') : chip('compliant','Current')}</div>
      <div class="mono" style="font-size:var(--fs-lg);color:var(--pine-800);font-weight:500">${esc(p.number)}</div>
      <div style="font-size:var(--fs-caption);color:var(--slategreen)">${esc(p.type)}</div>
      <div style="font-size:var(--fs-micro);color:var(--fieldgray);margin-top:8px">Expires <b>${fmt(p.expires)}</b>${p.renewalDue ? ` · renewal due ${fmtShort(p.renewalDue)}` : ''}</div>
      <div style="font-size:var(--fs-micro);color:var(--fieldgray)">${po.length} obligations tracked</div>
    </div>`;
  }).join('');
  const next90 = obs.filter(o => o.nextDue && days(o.nextDue) >= -30 && days(o.nextDue) <= 90).sort((a,b) => pd(a.nextDue) - pd(b.nextDue));

      <div style="font-size:var(--fs-micro);color:var(--fieldgray);margin-bottom:8px">${pr.permitId ? 'Permit ' + esc(PERMITS[pr.permitId].number) + ' · ' : ''}due ${fmt(pr.due)} · lead ${esc(STAFF[pr.lead].name)}</div>
      <div class="progress"><div style="width:${pr.pctComplete}%"></div></div>
      <div style="font-size:var(--fs-micro);color:var(--fieldgray);margin-top:4px">${pr.pctComplete}% · ${esc(pr.notes)}</div>
    </div>`).join('');
  $('#view').innerHTML = `
    <div class="breadcrumbs"><a href="#/">Portfolio</a> › <a href="#/client/${c.id}">${esc(c.name)}</a> › ${esc(s.name)}</div>
    <div class="pagehead"><div><h1>${esc(s.name)}</h1><div class="sub">${esc(s.city)}, ${esc(s.county)} County, MS${s.receivingStream ? ' · receiving stream: ' + esc(s.receivingStream) : ''} — ${esc(s.description)}</div></div></div>
    <div class="section-label">Permits at this site</div>
    <div class="grid" style="grid-template-columns:repeat(${Math.min(permits.length,3)},1fr);margin-bottom:var(--s-6)">${permitCards}</div>

      <div>
        <div class="section-label">Site deadlines · trailing 30 / next 90 days</div>

function docRow(d){

  const projs = D.projects.filter(pr => pr.permitId === pid);
  setCrumb(`<a href="#/client/${c.id}">${esc(c.name)}</a> › <a href="#/site/${s.id}">${esc(s.name)}</a> › <b class="mono">${esc(p.number)}</b>`);

        <div class="t-text"><span class="kind-tag ${a.kind}">${a.kind.replace('-',' ')}</span>${esc(a.text)}</div><div class="t-by">${esc(who)}</div></li>`;

    <div class="card card-pad" style="margin-bottom:var(--s-2)">

          <div style="font-size:var(--fs-base);color:var(--slategreen)">${esc(p.type)}</div>
          <div style="font-size:var(--fs-caption);color:var(--fieldgray);margin-top:4px">${esc(p.description)}</div>
          <div style="margin-top:8px">${cite(p.renewalRule, true)}</div>
        </div>
        <div style="min-width:120px">${projs.map(pr => `<div class="card card-pad" style="background:var(--pine-100);border-color:var(--pine-300);margin-bottom:8px">
          <div style="font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:.1em;color:var(--pine-700);font-weight:700">Active project</div>

          <div class="progress" style="margin-top:6px"><div style="width:${pr.pctComplete}%"></div></div>
          <div style="font-size:var(--fs-micro);color:var(--fieldgray);margin-top:3px">${pr.pctComplete}% · due ${fmtShort(pr.due)} · ${esc(STAFF[pr.lead].initials)}</div>
        </div>`).join('')}</div>
      </div>
      <div class="meta-grid">
        <div class="m"><div class="k">Agency</div><div class="v" style="font-family:var(--font-body)">${esc(p.agency)}</div></div>
        <div class="m"><div class="k">Issued</div><div class="v">${fmt(p.issued)}</div></div>

    <div class="tabs">
      ${tabBtn('obligations','Obligations', obs.length)}

      ${tabBtn('conditions','Limits & conditions', null)}

}

    <tbody>${sorted.map(o => `<tr class="${o.status === 'overdue' ? 'ovd' : ''}">
      <td><b>${esc(o.title)}</b><br><span style="font-size:var(--fs-micro);color:var(--fieldgray)">${esc(o.deadlineRule)}</span>${o.notes ? `<br><span style="font-size:var(--fs-micro);color:var(--slategreen);font-style:italic">${esc(o.notes)}</span>` : ''}</td>
      <td><span class="kind-tag">${esc(o.category)}</span></td>
      <td style="font-size:var(--fs-micro)">${esc(o.frequency)}</td>
      <td>${cite(o.citation)}</td>
      <td>${duecell(o.nextDue)}</td>
      <td>${av(o.assignee)}</td>

}

  <div>
    <div class="card card-pad" style="border-style:dashed;text-align:center;background:var(--verdigris-100);border-color:var(--verdigris-300)">
      <div style="font-family:var(--font-display);font-size:var(--fs-2xl);color:var(--verdigris-600)">§</div>
      <b style="font-size:var(--fs-caption);color:var(--pine-800)">Drop submittals, agency letters, or lab data</b>

function ladderHtml(key){

/* ═══════════ CALENDAR ═══════════ */
let calY = 2026, calM = 7; // August 2026
function calShift(d){ calM += d; if(calM < 0){calM = 11; calY--;} if(calM > 11){calM = 0; calY++;} viewCalendar(); }
function viewCalendar(){
  setCrumb(`<b>${esc(D.firm.name)}</b> · Compliance calendar`);
  const first = new Date(calY, calM, 1);
  const startDow = first.getDay();
  const dim = new Date(calY, calM + 1, 0).getDate();
  const cells = [];
  const prevDim = new Date(calY, calM, 0).getDate();
  for(let i = 0; i < startDow; i++) cells.push({d: prevDim - startDow + 1 + i, dim: true});
  for(let d = 1; d <= dim; d++) cells.push({d, dim: false});
  while(cells.length % 7) cells.push({d: cells.length - startDow - dim + 1, dim: true});
  const iso = d => `${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const obsByDay = {};
  D.obligations.forEach(o => { if(o.nextDue) (obsByDay[o.nextDue] = obsByDay[o.nextDue] || []).push(o); });
  D.projects.filter(pr => pr.status !== 'complete').forEach(pr => { (obsByDay[pr.due] = obsByDay[pr.due] || []).push({project: true, pr}); });
  const monthItems = D.obligations.filter(o => o.nextDue && o.nextDue.startsWith(`${calY}-${String(calM+1).padStart(2,'0')}`)).length;
  const grid = cells.map(c => {
    if(c.dim) return `<div class="cal-cell dim"><div class="cal-date">${c.d}</div></div>`;
    const key = iso(c.d);
    const items = obsByDay[key] || [];
    const isToday = key === D.today;
    const pills = items.slice(0,3).map(it => {
      if(it.project) return `<span class="pill project" onclick="go('#/site/${it.pr.siteId}')" title="${esc(it.pr.name)}">◳ ${esc(it.pr.name)}</span>`;
      const p = PERMITS[it.permitId];
      return `<span class="pill ${it.status}" onclick="go('#/permit/${p.id}/obligations')" title="${esc(it.title)} — ${esc(clientOf(p).name)}">${esc(it.title)}</span>`;
    }).join('');
    const more = items.length > 3 ? `<span style="color:var(--fieldgray)">+ ${items.length - 3} more</span>` : '';
    return `<div class="cal-cell ${isToday ? 'today' : ''}"><div class="cal-date">${c.d}</div>${pills}${more}</div>`;
  }).join('');
  $('#view').innerHTML = `
    <div class="pagehead"><div><h1>Compliance calendar</h1><div class="sub">Every dated obligation and project milestone across the portfolio. Click a pill to open its permit.</div></div></div>
    <div class="cal-head">
      <span class="cal-title">${['January','February','March','April','May','June','July','August','September','October','November','December'][calM]} ${calY}</span>
      <span style="font-size:var(--fs-micro);color:var(--fieldgray)">${monthItems} deadline${monthItems === 1 ? '' : 's'} this month</span>
      <div class="cal-nav">
        <button class="btn btn-ghost" onclick="calShift(-1)">‹ Prev</button>
        <button class="btn btn-ghost" onclick="calY=2026;calM=7;viewCalendar()">Today</button>
        <button class="btn btn-ghost" onclick="calShift(1)">Next ›</button>
      </div>
    </div>
    <div class="cal-grid">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="cal-dow">${d}</div>`).join('')}
      ${grid}
    </div>
    <div style="display:flex;gap:14px;margin-top:var(--s-4);font-size:var(--fs-micro);color:var(--slategreen);flex-wrap:wrap">
      <span><span class="pill overdue" style="display:inline;padding:1px 8px">&nbsp;</span> overdue</span>
      <span><span class="pill due" style="display:inline;padding:1px 8px">&nbsp;</span> due window</span>
      <span><span class="pill compliant" style="display:inline;padding:1px 8px">&nbsp;</span> scheduled</span>
      <span><span class="pill review" style="display:inline;padding:1px 8px">&nbsp;</span> in review</span>
      <span><span class="pill project" style="display:inline;padding:1px 8px">&nbsp;</span> project milestone</span>
    </div>`;
}

/* ═══════════ REGISTER ═══════════ */
const regFilter = {client:'', program:'', category:'', status:'', q:''};
function setReg(k, v){ regFilter[k] = v; viewRegister(); }
function viewRegister(){
  setCrumb(`<b>${esc(D.firm.name)}</b> · Obligation register`);
  let rows = [...D.obligations];
  if(regFilter.client) rows = rows.filter(o => clientOf(PERMITS[o.permitId]).id === regFilter.client);
  if(regFilter.program) rows = rows.filter(o => PERMITS[o.permitId].program === regFilter.program);
  if(regFilter.category) rows = rows.filter(o => o.category === regFilter.category);
  if(regFilter.status) rows = rows.filter(o => o.status === regFilter.status);
  if(regFilter.q) rows = rows.filter(o => (o.title + ' ' + o.deadlineRule + ' ' + (o.citation||'')).toLowerCase().includes(regFilter.q.toLowerCase()));
  rows.sort((a,b) => urgency(a) - urgency(b));
  const cats = [...new Set(D.obligations.map(o => o.category))].sort();
  $('#view').innerHTML = `
    <div class="pagehead"><div><h1>Obligation register</h1><div class="sub">The master list — every requirement, its citation, its clock, and its owner. ${D.obligations.length} obligations across ${D.permits.length} permits.</div></div>
      <button class="btn btn-ghost" style="margin-left:auto" onclick="alert('Prototype: exports the filtered register to Excel in the production build.')">Export to Excel</button></div>
    <div class="filterbar">
      <select onchange="setReg('client', this.value)">
        <option value="">All clients</option>${D.clients.map(c => `<option value="${c.id}" ${regFilter.client===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
      <select onchange="setReg('program', this.value)">
        <option value="">All programs</option>${['air','water','stormwater','pretreatment'].map(pr => `<option value="${pr}" ${regFilter.program===pr?'selected':''}>${pr}</option>`).join('')}</select>
      <select onchange="setReg('category', this.value)">
        <option value="">All categories</option>${cats.map(ct => `<option value="${ct}" ${regFilter.category===ct?'selected':''}>${ct}</option>`).join('')}</select>
      <select onchange="setReg('status', this.value)">
        <option value="">All statuses</option>${['overdue','due','review','compliant'].map(st => `<option value="${st}" ${regFilter.status===st?'selected':''}>${st}</option>`).join('')}</select>
      <input type="text" placeholder="Filter text or citation…" value="${esc(regFilter.q)}" onchange="setReg('q', this.value)" style="width:220px"/>
      <span style="font-size:var(--fs-micro);color:var(--fieldgray)">${rows.length} shown</span>
    </div>
    <div class="card" style="overflow-x:auto"><table class="tbl" style="table-layout:fixed;min-width:1040px">
      <colgroup><col style="width:30%"><col style="width:13%"><col style="width:9%"><col style="width:17%"><col style="width:11%"><col style="width:6%"><col style="width:14%"></colgroup>
      <thead><tr><th>Obligation</th><th>Client · permit</th><th>Category</th><th>Citation</th><th>Next due</th><th>Owner</th><th style="text-align:right">Status</th></tr></thead>
      <tbody>${rows.map(o => { const p = PERMITS[o.permitId];
        return `<tr class="row-link ${o.status==='overdue'?'ovd':''}" onclick="go('#/permit/${p.id}/obligations')">
        <td><b>${esc(o.title)}</b><br><span style="font-size:var(--fs-micro);color:var(--fieldgray)">${esc(o.frequency)} — ${esc(o.deadlineRule)}</span></td>
        <td style="font-size:var(--fs-micro)">${esc(clientOf(p).name.split(',')[0])}<br><span class="mono">${esc(p.number)}</span></td>
        <td><span class="kind-tag">${esc(o.category)}</span></td>
        <td>${cite(o.citation)}</td>
        <td>${duecell(o.nextDue)}</td>
        <td>${av(o.assignee)}</td>
        <td style="text-align:right">${obChip(o)}</td></tr>`;}).join('')}</tbody></table></div>`;
}

/* ═══════════ NOTIFICATIONS ═══════════ */
function viewNotifications(){
  setCrumb(`<b>${esc(D.firm.name)}</b> · Notification center`);
  const feed = [...D.notifications].sort((a,b) => pd(b.date) - pd(a.date));
  const scheduled = feed.filter(n => n.status === 'scheduled');
  const r = D.notificationRules;
  $('#view').innerHTML = `
    <div class="pagehead"><div><h1>Notification center</h1><div class="sub">Email and SMS reminders on an escalation ladder — early enough to prepare, loud enough to never miss a filing.</div></div></div>
    <div class="two-col">
      <div>
        ${scheduled.length ? `<div class="section-label">Scheduled</div><div class="card" style="margin-bottom:var(--s-6)">${scheduled.map(notifRow).join('')}</div>` : ''}
        <div class="section-label">Recent</div>
        <div class="card">${feed.filter(n => n.status !== 'scheduled').map(notifRow).join('')}</div>
      </div>
      <div>
        <div class="section-label">Escalation ladders</div>
        <div class="card card-pad" style="padding-top:6px">${Object.keys(r.ladders).map(ladderHtml).join('')}</div>
        <div class="section-label" style="margin-top:var(--s-6)">Delivery rules</div>
        <div class="card card-pad" style="font-size:var(--fs-caption);color:var(--slategreen);display:flex;flex-direction:column;gap:10px">
          <div><b>Channels.</b> Email at every rung; SMS joins at the ladder's SMS threshold. Acknowledging an item stops its reminders.</div>
          <div><b>Quiet hours.</b> ${esc(r.quietHours)}</div>
          <div><b>Digest.</b> ${esc(r.digest)}</div>
          <div><b>Escalation.</b> ${esc(r.escalation)}</div>
        </div>
        <div class="section-label" style="margin-top:var(--s-6)">Channel defaults</div>
        <div class="card card-pad" style="font-size:var(--fs-caption)">
          ${D.firm.staff.map(st => `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--ash)">
            <span class="avatar sm ${avColor(st.id)}">${esc(st.initials)}</span>
            <div style="flex:1"><b>${esc(st.name)}</b><br><span style="font-size:var(--fs-micro);color:var(--fieldgray)">${esc(st.role)}</span></div>
            <span style="font-size:9px;color:var(--fieldgray)"><span class="toggle"></span> email</span>
            <span style="font-size:9px;color:var(--fieldgray)"><span class="toggle ${st.role.includes('Principal') ? 'off' : ''}"></span> SMS</span>
          </div>`).join('')}
        </div>
      </div>
    </div>`;
}
/*__END_VIEWS__*/

/* ═══════════ search ═══════════ */
const sb = $('#searchbox'), sr = $('#searchresults');
sb.addEventListener('input', () => {
  const q = sb.value.trim().toLowerCase();
  if(q.length < 2){ sr.style.display = 'none'; return; }
  const hits = [];
  D.clients.forEach(c => { if(c.name.toLowerCase().includes(q)) hits.push({k:'Client', t:c.name, h:'#/client/'+c.id}); });
  D.sites.forEach(s => { if(s.name.toLowerCase().includes(q)) hits.push({k:'Site', t:s.name, h:'#/site/'+s.id}); });
  D.permits.forEach(p => { if((p.number+' '+p.type).toLowerCase().includes(q)) hits.push({k:'Permit', t:p.number+' — '+p.type, h:'#/permit/'+p.id}); });
  D.obligations.forEach(o => { if(o.title.toLowerCase().includes(q)) hits.push({k:'Obligation', t:o.title, h:'#/permit/'+o.permitId+'/obligations'}); });
  sr.innerHTML = hits.slice(0,9).map(x => `<a href="${x.h}"><span class="k">${x.k}</span><br>${esc(x.t)}</a>`).join('') || '<a><span class="k">No results</span></a>';
  sr.style.display = 'block';
});
document.addEventListener('click', e => { if(!e.target.closest('.search')) sr.style.display = 'none'; });
sr.addEventListener('click', () => { sr.style.display = 'none'; sb.value = ''; });

$('#todaychip').textContent = 'Demo date · ' + fmt(D.today);
route();
</script>
</body>
</html>
