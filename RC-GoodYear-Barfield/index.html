  var b64d = function(s){ return Uint8Array.from(atob(s), function(c){return c.charCodeAt(0);}); };
  var f = document.getElementById('f'), pw = document.getElementById('pw'), err = document.getElementById('err');
  f.addEventListener('submit', function(e){ e.preventDefault(); err.classList.remove('show'); unlock(pw.value); });
  async function unlock(password){
    try{
      var enc = new TextEncoder(), dec = new TextDecoder();
      var salt = b64d(DATA.salt), iv = b64d(DATA.iv), ct = b64d(DATA.ct);
      var baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:salt, iterations:DATA.iter, hash:'SHA-256'}, baseKey, {name:'AES-GCM', length:256}, false, ['decrypt']);
      var ptBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, ct);
      document.open(); document.write(dec.decode(ptBuf)); document.close();
    }catch(ex){ err.classList.add('show'); pw.value=''; pw.focus(); }
