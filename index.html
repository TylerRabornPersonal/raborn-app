<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raborn — Coming Soon</title>
  <meta name="description" content="Something new from Raborn is on the way." />
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #f5f5f5;
      --muted: #888;
      --accent: #4ade80;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
    }
    .wrap {
      padding: 2rem;
      position: relative;
      z-index: 1;
      animation: rise 1s ease-out both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      margin-bottom: 2rem;
      box-shadow: 0 0 0 0 rgba(74,222,128,0.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(74,222,128,0.5); }
      70% { box-shadow: 0 0 0 18px rgba(74,222,128,0); }
      100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }
    p {
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      max-width: 32ch;
      margin: 0 auto;
      line-height: 1.5;
    }
    .glow {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(74,222,128,0.12) 0%, transparent 60%);
      z-index: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <span class="dot"></span>
    <h1>Raborn</h1>
    <p>Something new is on the way. Check back soon.</p>
  </div>
</body>
</html>
