<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>25 Woodgreen · Office Selection</title>
<meta name="robots" content="noindex">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wg-primary:#5E4634;      /* Walnut */
    --wg-primary-deep:#43301F; /* Clove */
    --wg-accent:#2E4533;       /* Forest */
    --wg-pop:#C7DB46;          /* Citron */
    --wg-detail:#A98A52;       /* Brass */
    --wg-surface:#FBF7EC;      /* Cream */
    --wg-page:#F6F0E2;         /* Parchment */
    --wg-muted:#E9DFC9;        /* Sand */
    --wg-border:#D8CCB2;       /* Linen */
    --wg-ink-muted:#6B5F4F;    /* Drab */
    --wg-ink:#2C241B;          /* Ink */
    --wg-forest-900:#131E16;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--wg-page);color:var(--wg-ink);font-family:'Inter',system-ui,sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:40px 20px 72px}

  /* ---- header / wordmark ---- */
  header{text-align:center;margin-bottom:8px}
  .wordmark{font-family:'GFS Didot',serif;font-weight:400;font-size:clamp(26px,4.6vw,40px);letter-spacing:.1em}
  .wordmark .num{color:var(--wg-detail)}
  .wordmark .name{color:var(--wg-forest-900)}
  .locale{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.42em;color:var(--wg-ink-muted);margin-top:6px;text-transform:uppercase}
  .hairline{width:64px;height:1px;background:var(--wg-detail);margin:22px auto}
  .intro{font-family:'Fraunces',serif;font-size:clamp(17px,2.6vw,21px);color:var(--wg-primary);max-width:560px;margin:0 auto 6px}
  .hint{font-size:13.5px;color:var(--wg-ink-muted);max-width:560px;margin:0 auto}

  /* ---- legend ---- */
  .legend{display:flex;justify-content:center;gap:22px;margin:26px 0 8px;font-size:12.5px;color:var(--wg-ink-muted)}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .swatch{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--wg-border);background:var(--wg-surface)}
  .swatch.sel{background:var(--wg-accent);border-color:var(--wg-accent)}
  .count{font-weight:600;color:var(--wg-accent)}
  .save{font-size:12px;color:var(--wg-ink-muted);transition:opacity .3s ease}
  .save.err{color:#a04226;font-weight:500}

  /* ---- floor cards ---- */
  section.floor{background:var(--wg-surface);border:1px solid var(--wg-border);border-radius:14px;padding:26px 26px 30px;margin-top:26px;box-shadow:0 1px 2px rgba(44,36,27,.05)}
  .floor h2{font-family:'Fraunces',serif;font-weight:600;font-size:19px;color:var(--wg-primary-deep);text-align:center}
  .floor .sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--wg-detail);text-align:center;margin-top:4px;margin-bottom:18px}
  .plan{display:block;width:100%;height:auto}
  .plan.basement{max-width:52%;margin:0 auto}
  @media (max-width:640px){.plan.basement{max-width:78%}}

  /* ---- svg plan pieces ---- */
  .plan-fill{fill:var(--wg-muted)}
  .plan-wall{fill:none;stroke:var(--wg-primary-deep);stroke-width:3;stroke-linejoin:round}
  .room rect,.room polygon{fill:var(--wg-surface);stroke:var(--wg-border);stroke-width:1.4;transition:fill .12s ease,stroke .12s ease}
  .room{cursor:pointer}
  .room:hover rect,.room:hover polygon{stroke:var(--wg-accent);stroke-width:2}
  .room.sel rect,.room.sel polygon{fill:var(--wg-accent);stroke:var(--wg-accent)}
  .room text{font-family:'Inter',sans-serif;font-weight:600;fill:var(--wg-primary-deep);text-anchor:middle;dominant-baseline:central;pointer-events:none;user-select:none}
  .room.sel text{fill:var(--wg-surface)}
  .room .tick{opacity:0;font-weight:500;transition:opacity .12s ease}
  .room.sel .tick{opacity:1;fill:var(--wg-pop)}

  footer{margin-top:34px;text-align:center;font-size:12px;color:var(--wg-ink-muted);letter-spacing:.06em}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="wordmark"><span class="num">25</span> <span class="name">WOODGREEN</span></div>
    <div class="locale">Madison &middot; Mississippi</div>
    <div class="hairline"></div>
    <p class="intro">2001 Building &mdash; general floor plan</p>
  </header>

  <div class="legend">
    <span><i class="swatch"></i> Available</span>
    <span><i class="swatch sel"></i> Selected</span>
    <span class="count" id="count">0 selected</span>
    <span class="save" id="save"></span>
  </div>

  <section class="floor">
    <h2>Main Floor</h2>
    <div class="sub">2001 Building &middot; Offices</div>
    <svg id="plan-main" class="plan" viewBox="486 110 512 302" aria-label="2001 Building main floor plan"></svg>
  </section>

  <section class="floor">
    <h2>Lower Level</h2>
    <div class="sub">2001 Building &middot; Storage &amp; Server</div>
    <svg id="plan-basement" class="plan basement" viewBox="245 108 492 495" aria-label="2001 Building lower level plan"></svg>
  </section>

  <footer>25 WOODGREEN PLACE &middot; MADISON, MS</footer>
</div>

<script>
/* Traced plan geometry (from the 25 Woodgreen site) — square footage intentionally omitted. */
const PLANS = {
  main: {
    svg: "plan-main",
    fontSize: 13,
    fill: "496,287.7 496,143.7 608.1,143.7 608.1,120 874.7,120 874.7,143.7 988,143.7 988,386.2 875.8,386.2 875.8,403.8 776.5,403.8 776.5,387 708.1,387 708.1,403.8 608.1,403.8 608.1,386.2 495.3,386.2 495.3,287.7",
    walls: ["496,287.7 496,143.7 608.1,143.7 608.1,120 874.7,120 874.7,143.7 988,143.7 988,386.2 875.8,386.2 875.8,403.8 776.5,403.8 776.5,387 708.1,387 708.1,403.8 608.1,403.8 608.1,386.2 495.3,386.2 495.3,287.7 496,287.7"],
    rooms: {
      B1:{x:496.0,y:143.7,w:84.2,h:81.2},
      B2:{x:580.2,y:120.0,w:63.45,h:105.6,points:"580.2,143.7 608.1,143.7 608.1,120 643.65,120 643.65,225.6 580.2,225.6"},
      B3:{x:643.65,y:120.0,w:73.45,h:81.2},
      B4:{x:717.1,y:120.0,w:48.8,h:81.2},
      B5:{x:765.9,y:120.0,w:45.2,h:81.6},
      B6:{x:811.1,y:120.0,w:63.6,h:81.6},
      B7:{x:874.7,y:143.7,w:45.6,h:80.9},
      B8:{x:920.3,y:143.7,w:67.7,h:80.9},
      I1:{x:496.0,y:224.9,w:53.0,h:68.7},
      P9:{x:495.3,y:306.8,w:46.9,h:79.4},
      P8:{x:542.2,y:306.8,w:45.5,h:79.4},
      P7:{x:587.7,y:306.8,w:55.15,h:97.0,points:"587.7,306.8 642.85,306.8 642.85,403.8 608.1,403.8 608.1,386.2 587.7,386.2"},
      P6:{x:642.85,y:306.8,w:65.25,h:97.0},
      P5:{x:708.1,y:306.8,w:46,h:79.4},
      P4:{x:776.5,y:306.8,w:40.1,h:97.0},
      P3:{x:816.6,y:306.8,w:59.2,h:97.0},
      P2:{x:875.8,y:306.8,w:49.8,h:79.4},
      P1:{x:925.6,y:306.8,w:62.4,h:79.4},
      CONF:{x:940.7,y:224.6,w:47.3,h:82.2}
    }
  },
  basement: {
    svg: "plan-basement",
    fontSize: 22,
    fill: "444,120 606.7,120 606.7,164 720,164 720,580.7 400.7,580.7 400.7,319.4 314.7,319.4 314.7,359 260,359 260,241 314.7,241 314.7,280.7 444,280.7",
    walls: ["444,120 606.7,120 606.7,164 720,164 720,580.7 400.7,580.7 400.7,319.4 314.7,319.4 314.7,359 260,359 260,241 314.7,241 314.7,280.7 444,280.7 444,120"],
    rooms: {
      SVR:{x:444,y:120,w:160.2,h:160.7},
      LCK:{x:609.2,y:164,w:110.8,h:116.7},
      FL:{x:400.7,y:319.4,w:157.5,h:261.3},
      FR:{x:563.2,y:319.4,w:156.8,h:261}
    }
  }
};

/* ---- Supabase (live save) ---------------------------------------------- */
const SUPABASE_URL = "PASTE_SUPABASE_URL";        // e.g. https://abcdefgh.supabase.co
const SUPABASE_ANON_KEY = "PASTE_SUPABASE_ANON_KEY";
const TABLE = "hood_office_selections";

const db = (SUPABASE_URL.startsWith("https") && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

const saveEl = () => document.getElementById("save");
let saveTimer;
function setSave(msg, isErr){
  const el = saveEl();
  el.textContent = msg;
  el.classList.toggle("err", !!isErr);
  clearTimeout(saveTimer);
  if (msg && !isErr) saveTimer = setTimeout(() => { el.textContent = ""; }, 2000);
}

async function persist(id, isSelected, g){
  if (!db) return; // not configured — behave as local-only
  setSave("saving…");
  const { error } = await db.from(TABLE).upsert({
    office_id: id,
    selected: isSelected,
    updated_at: new Date().toISOString()
  });
  if (error) {
    // revert the visual state so what they see matches what's saved
    isSelected ? selected.delete(id) : selected.add(id);
    g.classList.toggle("sel");
    g.setAttribute("aria-pressed", g.classList.contains("sel"));
    document.getElementById("count").textContent = selected.size + " selected";
    setSave("couldn't save — check connection and tap again", true);
  } else {
    setSave("saved ✓");
  }
}

async function loadSaved(){
  if (!db) return;
  const { data, error } = await db.from(TABLE).select("office_id,selected").eq("selected", true);
  if (error || !data) return;
  for (const row of data){
    const g = document.querySelector('g[data-id="' + row.office_id + '"]');
    if (!g) continue;
    selected.add(row.office_id);
    g.classList.add("sel");
    g.setAttribute("aria-pressed", "true");
  }
  document.getElementById("count").textContent = selected.size + " selected";
}
/* ------------------------------------------------------------------------ */

const NS = "http://www.w3.org/2000/svg";
const selected = new Set();

function el(tag, attrs){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

function render(key){
  const plan = PLANS[key];
  const svg = document.getElementById(plan.svg);

  svg.appendChild(el("polygon", { points: plan.fill, class: "plan-fill" }));
  plan.walls.forEach(w => svg.appendChild(el("polyline", { points: w, class: "plan-wall" })));

  for (const code in plan.rooms){
    const r = plan.rooms[code];
    const g = el("g", { class: "room", "data-id": key + ":" + code, tabindex: "0", role: "button",
                        "aria-pressed": "false", "aria-label": "Office " + code });

    g.appendChild(r.points
      ? el("polygon", { points: r.points })
      : el("rect", { x: r.x, y: r.y, width: r.w, height: r.h, rx: 6 }));

    const label = el("text", { x: r.x + r.w/2, y: r.y + r.h/2, "font-size": plan.fontSize });
    label.textContent = code;
    g.appendChild(label);

    const tick = el("text", { x: r.x + r.w/2, y: r.y + r.h/2 + plan.fontSize*1.15,
                              "font-size": plan.fontSize*0.72, class: "tick" });
    tick.textContent = "✓";
    g.appendChild(tick);

    const toggle = () => {
      const id = g.getAttribute("data-id");
      const nowSelected = !selected.has(id);
      nowSelected ? selected.add(id) : selected.delete(id);
      g.classList.toggle("sel");
      g.setAttribute("aria-pressed", g.classList.contains("sel"));
      document.getElementById("count").textContent = selected.size + " selected";
      persist(id, nowSelected, g);
    };
    g.addEventListener("click", toggle);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });

    svg.appendChild(g);
  }
}

render("main");
render("basement");
loadSaved();
</script>
</body>
</html>
